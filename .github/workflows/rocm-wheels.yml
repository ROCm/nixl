name: ROCm Wheels

on:
  pull_request:
    paths:
      - .ci/rocjitsu/**
      - .ci/scripts/amd_wheels_branch.py
      - .ci/scripts/rocm_wheel_python_test.py
      - .ci/scripts/rocm_wheel_smoke_test.py
      - .ci/scripts/rocm_wheel_two_node_test.py
      - .ci/scripts/stamp_wheel_version.py
      - .github/amd-wheels-branch.txt
      - .github/workflows/rocm-wheels.yml
      - .github/workflows/rocm-wheels-rocjitsu.yml
      - .github/workflows/rocm-wheels-rocjitsu-2vm.yml
      - .ci/scripts/rocm_wheel_unit_test.py
      - .github/workflows/rocm-wheels-rocjitsu-unit.yml
      - contrib/Dockerfile.tests
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      rocm-versions:
        description: ROCm versions to build for, as comma-separated X.Y.Z.
        required: false
        type: string
        default: 7.14.1,10.1.0,10.2.0
      python-versions:
        description: Python versions to build for, comma-separated. Must include 3.12, which the test jobs use.
        required: false
        type: string
        default: 3.10,3.11,3.12,3.13,3.14
      ref:
        description: Branch, tag or commit of this repository to build and test. Empty means the branch named in .github/amd-wheels-branch.txt.
        required: false
        type: string
        default: ''
      version-suffix:
        description: Appended to the wheel version before building, for example .dev20261118.
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      ref:
        description: Branch, tag or commit of this repository to build and test. Empty means the branch named in .github/amd-wheels-branch.txt.
        required: false
        type: string
        default: ''
      python-versions:
        description: Python versions to build for, comma-separated. Empty means every supported version.
        required: false
        type: string
        default: ''
      rocm-versions:
        description: ROCm versions to build for, as comma-separated X.Y.Z. Empty means the default set.
        required: false
        type: string
        default: ''
      version-suffix:
        description: Appended to the wheel version before building, for example .dev20261118.
        required: false
        type: string
        default: ''
      artifact-suffix:
        description: Appended to the name of every artifact, so that one run can build several refs. For example -main.
        required: false
        type: string
        default: ''
      run-vm-tests:
        description: Run the rocjitsu jobs.
        required: false
        type: boolean
        default: true
    # A caller that runs this workflow in a matrix gets one leg's values only;
    # the artifact names are the fixed forms shown here for that reason.
    outputs:
      supported:
        description: Whether the ref can build ROCm wheels, as true or false.
        value: ${{ jobs.plan.outputs.supported }}
      version:
        description: The wheel version built.
        value: ${{ jobs.plan.outputs.version }}
      wheels-artifact:
        description: Name of the artifact holding the merged nixl-rocm wheels.
        value: nixl-rocm-wheels${{ inputs.artifact-suffix }}
      results-artifact:
        description: Name of the artifact holding results.json.
        value: rocm-results${{ inputs.artifact-suffix }}

permissions:
  contents: read

concurrency:
  group: rocm-wheels-${{ github.ref }}${{ inputs.artifact-suffix }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rocm-versions: ${{ steps.plan.outputs.rocm-versions }}
      python-versions: ${{ steps.plan.outputs.python-versions }}
      test-python: ${{ steps.plan.outputs.test-python }}
      supported: ${{ steps.source.outputs.supported }}
      ref: ${{ steps.ref.outputs.ref }}
      write-cache: ${{ steps.ref.outputs.write-cache }}
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      run-vm-tests: ${{ steps.inputs.outputs.run-vm-tests }}
      wheels-artifact: ${{ steps.inputs.outputs.wheels-artifact }}
      # Empty when the step that sets them did not get that far. Every reader
      # takes empty as false.
      nixlbench: ${{ steps.nixlbench.outputs.build }}
      nixlbench-present: ${{ steps.nixlbench.outputs.present }}
    steps:
      - name: Check the inputs
        id: inputs
        env:
          REF: ${{ inputs.ref }}
          VERSION_SUFFIX: ${{ inputs.version-suffix }}
          ARTIFACT_SUFFIX: ${{ inputs.artifact-suffix }}
          # Empty on the events that have no such input, which run the tests.
          RUN_VM_TESTS: ${{ inputs.run-vm-tests }}
        run: |
          set -euo pipefail
          if [ -n "$REF" ]; then
            if [[ ! "$REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] || [[ "$REF" == *..* ]]; then
              echo "::error::ref must be a branch, tag or commit of this repository"
              exit 1
            fi
          fi
          if [[ ! "$VERSION_SUFFIX" =~ ^[A-Za-z0-9.]*$ ]]; then
            echo "::error::version-suffix may hold letters, digits and dots only"
            exit 1
          fi
          if [[ ! "$ARTIFACT_SUFFIX" =~ ^(-[A-Za-z0-9._-]+)?$ ]]; then
            echo "::error::artifact-suffix must be empty or a dash followed by letters, digits, dots, underscores and dashes"
            exit 1
          fi
          vm=true
          if [ "$RUN_VM_TESTS" = "false" ]; then vm=false; fi
          {
            echo "run-vm-tests=${vm}"
            echo "wheels-artifact=nixl-rocm-wheels${ARTIFACT_SUFFIX}"
          } >> "$GITHUB_OUTPUT"

      - name: Select ROCm and Python versions
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          ROCM_VERSIONS: ${{ inputs.rocm-versions }}
          PYTHON_VERSIONS: ${{ inputs.python-versions }}
          # The Python of the ubuntu:24.04 test container.
          TEST_PYTHON: "3.12"
        run: |
          set -euo pipefail
          rocm=${ROCM_VERSIONS:-7.14.1,10.1.0,10.2.0}
          python=${PYTHON_VERSIONS:-3.10,3.11,3.12,3.13,3.14}
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python=$TEST_PYTHON
          fi
          if [[ ! "$rocm" =~ ^[0-9]+\.[0-9]+\.[0-9]+(,[0-9]+\.[0-9]+\.[0-9]+)*$ ]]; then
            echo "::error::rocm-versions must be comma-separated X.Y.Z, got '${rocm}'"
            exit 1
          fi
          if [[ ! "$python" =~ ^3\.[0-9]+(,3\.[0-9]+)*$ ]]; then
            echo "::error::python-versions must be comma-separated 3.Y, got '${python}'"
            exit 1
          fi
          case ",${python}," in
            *",${TEST_PYTHON},"*) ;;
            *)
              echo "::error::python-versions must include ${TEST_PYTHON}, which the test jobs use"
              exit 1
              ;;
          esac
          {
            echo "rocm-versions=[\"${rocm//,/\",\"}\"]"
            echo "python-versions=${python}"
            echo "test-python=${TEST_PYTHON}"
          } >> "$GITHUB_OUTPUT"

      # The CI scripts and the name of the wheels branch come from the commit
      # this workflow file was read from, never from the source that is built.
      - name: Checkout the CI files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            .ci
            .github
          persist-credentials: false

      # Without a ref the wheels branch is built. Every ref shares one build
      # cache, which has room for one copy, so only a build of the wheels
      # branch writes it. A tag's cache is readable from no other ref, and a
      # pull request from a fork is not trusted with it, so those only read.
      - name: Select the ref to build
        id: ref
        env:
          REF: ${{ inputs.ref }}
          MAY_WRITE_CACHE: ${{ github.ref_type != 'tag' && !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
        run: |
          set -euo pipefail
          wheels_branch=$(python3 -I .ci/scripts/amd_wheels_branch.py .github/amd-wheels-branch.txt)
          ref=${REF:-$wheels_branch}
          write_cache=false
          if [ "$ref" = "$wheels_branch" ] && [ "$MAY_WRITE_CACHE" = "true" ]; then
            write_cache=true
          fi
          echo "building ${ref}; the wheels branch is ${wheels_branch}; write-cache=${write_cache}"
          {
            echo "ref=${ref}"
            echo "wheels-branch=${wheels_branch}"
            echo "write-cache=${write_cache}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout the source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.ref.outputs.ref }}
          path: source
          persist-credentials: false

      - name: Check that the source can build ROCm wheels
        id: source
        working-directory: source
        env:
          REF: ${{ steps.ref.outputs.ref }}
          WHEELS_BRANCH: ${{ steps.ref.outputs.wheels-branch }}
          VERSION_SUFFIX: ${{ inputs.version-suffix }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          version=$(python3 -I -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])' 2>/dev/null || true)
          missing=""
          if ! grep -q -- '--rocm-version' contrib/build-container.sh 2>/dev/null; then
            missing="contrib/build-container.sh has no --rocm-version option"
          elif [ ! -f contrib/wheel_merge_rocm.py ]; then
            missing="contrib/wheel_merge_rocm.py is missing"
          fi
          if [ -n "$missing" ]; then
            if [ "$REF" = "$WHEELS_BRANCH" ]; then
              echo "::error::${REF} (${sha:0:8}) is the wheels branch but cannot build ROCm wheels: ${missing}"
              exit 1
            fi
            supported=false
            msg="ROCm wheels skipped for ${REF} (${sha:0:8}): ${missing}, so this source cannot build them yet."
            echo "::notice title=ROCm wheels not supported::${msg}"
            echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
          else
            supported=true
            if [ -n "$VERSION_SUFFIX" ]; then
              version=$(python3 -I ../.ci/scripts/stamp_wheel_version.py "$VERSION_SUFFIX")
            fi
            if [ -z "$version" ]; then
              echo "::error::pyproject.toml has no [project] version"
              exit 1
            fi
          fi
          {
            echo "supported=${supported}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

      # The nixlbench wheel is not required, and this step cannot fail the job.
      # A nightly or pull request run builds the wheel only once the repository
      # variable AMD_NIXLBENCH_WHEEL is "true", because the build is done in
      # the build job and so delays the NIXL wheels. A run of this workflow
      # started by hand, which is never published, builds it unless the
      # variable is "false". The nightly always passes an artifact suffix,
      # which is what tells the two apart.
      - name: Decide whether to build the nixlbench wheel
        id: nixlbench
        continue-on-error: true
        timeout-minutes: 1
        working-directory: source
        env:
          SUPPORTED: ${{ steps.source.outputs.supported }}
          SWITCH: ${{ vars.AMD_NIXLBENCH_WHEEL }}
          EVENT_NAME: ${{ github.event_name }}
          ARTIFACT_SUFFIX: ${{ inputs.artifact-suffix }}
        run: |
          set +e
          present=false
          if [ "$SUPPORTED" = "true" ] \
              && [ -f contrib/build-nixlbench-wheel.sh ] \
              && [ -f contrib/wheel_nixlbench.py ] \
              && [ -f benchmark/nixlbench/wheel/dispatcher.py ] \
              && grep -q -- '--nixlbench-wheel-output-dir' contrib/build-container.sh 2>/dev/null \
              && grep -q -- '--nixlbench-nixl-wheel-dir' contrib/build-container.sh 2>/dev/null; then
            present=true
          fi
          build=false
          if [ "$present" = "true" ]; then
            if [ "$SWITCH" = "true" ]; then
              build=true
            elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -z "$ARTIFACT_SUFFIX" ] && [ "$SWITCH" != "false" ]; then
              build=true
            else
              msg="This source can build the nixlbench wheel, but this run does not build it: a nightly or pull request run builds it only when the repository variable AMD_NIXLBENCH_WHEEL is 'true', and a run of ROCm Wheels started by hand unless it is 'false'."
              echo "::notice title=nixlbench wheel not built::${msg}"
              echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "nixlbench wheel: present=${present}, build=${build}"
          {
            echo "present=${present}"
            echo "build=${build}"
          } >> "$GITHUB_OUTPUT"
          exit 0

  build:
    name: Build (ROCm ${{ matrix.rocm-version }})
    needs: plan
    if: needs.plan.outputs.supported == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        rocm-version: ${{ fromJSON(needs.plan.outputs.rocm-versions) }}
    env:
      ROCM_VERSION: ${{ matrix.rocm-version }}
      PYTHON_VERSIONS: ${{ needs.plan.outputs.python-versions }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android \
            /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Checkout the CI files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: ci
          sparse-checkout: .ci
          persist-credentials: false

      - name: Stamp the wheel version
        if: inputs.version-suffix != ''
        env:
          VERSION_SUFFIX: ${{ inputs.version-suffix }}
          PLANNED_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          version=$(python3 -I ci/.ci/scripts/stamp_wheel_version.py "$VERSION_SUFFIX")
          if [ "$version" != "$PLANNED_VERSION" ]; then
            echo "::error::stamped version ${version} is not the planned ${PLANNED_VERSION}"
            exit 1
          fi
          git diff --stat

      # The Dockerfile copies the whole workspace into the image.
      - name: Remove the CI files from the build context
        run: rm -rf ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Expose the Actions cache to BuildKit
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # Only the dependency stage is cached: the wheel stage starts with the
      # source tree, so its layers are never reused. Every build reads the
      # cache; the plan job decides which one writes it.
      - name: Build the dependency stage
        env:
          CACHE_SCOPE: rocm-wheel-base-${{ matrix.rocm-version }}
          WRITE_CACHE: ${{ needs.plan.outputs.write-cache }}
        run: |
          set -euo pipefail
          cache="--cache-from type=gha,scope=${CACHE_SCOPE}"
          if [ "$WRITE_CACHE" = "true" ]; then
            cache+=" --cache-to type=gha,mode=max,ignore-error=true,scope=${CACHE_SCOPE}"
          fi
          # Sources from before --rocm-version selected ROCm by itself need
          # --gpu-stack as well; later ones do not have that option.
          stack=""
          if grep -q -- '--gpu-stack' contrib/build-container.sh; then stack="--gpu-stack rocm"; fi
          # shellcheck disable=SC2086
          DOCKER_BUILD_EXTRA_ARGS="--target wheel_base ${cache}" \
            ./contrib/build-container.sh \
              --dockerfile contrib/Dockerfile.manylinux \
              ${stack} --rocm-version "$ROCM_VERSION" \
              --python-versions "$PYTHON_VERSIONS" \
              --tag "nixl-wheel-base:rocm${ROCM_VERSION}"

      # The wheels are written to dist/; the image is never loaded.
      - name: Build the wheels
        run: |
          set -euo pipefail
          stack=""
          if grep -q -- '--gpu-stack' contrib/build-container.sh; then stack="--gpu-stack rocm"; fi
          # shellcheck disable=SC2086
          ./contrib/build-container.sh \
            --dockerfile contrib/Dockerfile.manylinux \
            ${stack} --rocm-version "$ROCM_VERSION" \
            --python-versions "$PYTHON_VERSIONS" \
            --wheel-output-dir dist

      - name: Check the wheels
        env:
          # Set only when the version was stamped.
          STAMPED_VERSION: ${{ inputs.version-suffix != '' && needs.plan.outputs.version || '' }}
        run: |
          set -euo pipefail
          df -h /
          ls -l dist
          backend="nixl_rocm$(echo "$ROCM_VERSION" | cut -d. -f1,2 | tr . _)"
          compgen -G "dist/${backend}-*.whl" > /dev/null
          if [ -n "$STAMPED_VERSION" ] && ! compgen -G "dist/${backend}-${STAMPED_VERSION}-*.whl" > /dev/null; then
            echo "::error::dist/ holds no ${backend} wheel of the stamped version ${STAMPED_VERSION}"
            exit 1
          fi
          for wheel in dist/*.whl; do
            case "$(basename "$wheel")" in
              "${backend}"-*) ;;
              *)
                echo "::error::dist/ holds ${wheel}, which is not a ${backend} backend wheel"
                exit 1
                ;;
            esac
          done

      - name: Upload the backend wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rocm-backend-wheels-${{ matrix.rocm-version }}${{ inputs.artifact-suffix }}
          path: dist/*.whl
          if-no-files-found: error

      # The rest of this job is the nixlbench wheel, which is not required: the
      # NIXL backend wheels are uploaded by now, every step below is
      # continue-on-error and has a time limit, and none runs unless the plan
      # job chose to build nixlbench. It is built here because only this job
      # holds the build cache of the NIXL wheels nixlbench must link against;
      # the cache's key is the content of the checkout, so dist/ is moved out
      # of it first, which puts the checkout back as the NIXL build saw it.
      # The time and disk limits are set here and nowhere else.
      - name: Build the nixlbench wheel
        id: nixlbench
        if: needs.plan.outputs.nixlbench == 'true'
        continue-on-error: true
        timeout-minutes: 20
        env:
          NIXLBENCH_CAP_S: 1080
          NIXLBENCH_MIN_FREE_GB: 8
        run: |
          set -euo pipefail
          df -h /
          free_kb=$(df --output=avail -k / | awk 'NR == 2 { print $1 }') || free_kb=""
          if [[ ! "$free_kb" =~ ^[0-9]+$ ]] || [ "$free_kb" -lt $((NIXLBENCH_MIN_FREE_GB * 1024 * 1024)) ]; then
            echo "::warning title=nixlbench wheel not built::ROCm ${ROCM_VERSION}: / has ${free_kb:-an unknown number of} KiB free, less than the ${NIXLBENCH_MIN_FREE_GB} GiB the nixlbench build needs, so it is skipped"
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mv dist "$RUNNER_TEMP/nixl-dist"
          stack=""
          if grep -q -- '--gpu-stack' contrib/build-container.sh; then stack="--gpu-stack rocm"; fi
          # A kill by timeout is an ordinary failure of this step.
          # shellcheck disable=SC2086
          timeout --signal=TERM --kill-after=30s "${NIXLBENCH_CAP_S}s" \
            ./contrib/build-container.sh \
              --dockerfile contrib/Dockerfile.manylinux \
              ${stack} --rocm-version "$ROCM_VERSION" \
              --python-versions "$PYTHON_VERSIONS" \
              --nixlbench-wheel-output-dir "$RUNNER_TEMP/nixlbench-dist" \
              --nixlbench-nixl-wheel-dir "$RUNNER_TEMP/nixl-dist"
          echo "built=true" >> "$GITHUB_OUTPUT"
          df -h /

      # build-container.sh exports the nixlbench wheel before it compares the
      # NIXL wheels nixlbench was built against with the ones uploaded above,
      # so the comparison is repeated here. Only what passed is staged, and
      # the staging directory appears only once everything is in it.
      - name: Check the nixlbench wheel
        id: nixlbench-check
        if: steps.nixlbench.outcome == 'success' && steps.nixlbench.outputs.built == 'true'
        continue-on-error: true
        timeout-minutes: 2
        env:
          # Set only when the version was stamped.
          STAMPED_VERSION: ${{ inputs.version-suffix != '' && needs.plan.outputs.version || '' }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          reject() {
            echo "::warning title=nixlbench wheel rejected::ROCm ${ROCM_VERSION}: $1"
            exit 1
          }
          out="$RUNNER_TEMP/nixlbench-dist"
          nixl="$RUNNER_TEMP/nixl-dist"
          ls -l "$out" "$nixl"
          backend="nixlbench_rocm$(echo "$ROCM_VERSION" | cut -d. -f1,2 | tr . _)"
          wheels=("$out"/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            reject "expected one nixlbench wheel, found ${#wheels[@]}"
          fi
          wheel=${wheels[0]}
          name=${wheel##*/}
          if [[ "$name" != "${backend}-"*"-py3-none-"*.whl ]]; then
            reject "${name} is not a ${backend} py3-none wheel"
          fi
          if [ -n "$STAMPED_VERSION" ] && [[ "$name" != "${backend}-${STAMPED_VERSION}-py3-none-"*.whl ]]; then
            reject "${name} does not carry the stamped version ${STAMPED_VERSION}"
          fi
          sums="$out/nixl-wheels.sha256"
          if [ ! -s "$sums" ]; then
            reject "nixl-wheels.sha256 is missing or empty"
          fi
          nixl_wheels=("$nixl"/*.whl)
          if [ "${#nixl_wheels[@]}" -eq 0 ]; then
            reject "the NIXL backend wheels are no longer in ${nixl}"
          fi
          # One line per NIXL wheel: <sha256>, two separator characters, <name>.
          listed=$(sed -E 's/^[0-9a-f]{64} [ *]//' "$sums" | LC_ALL=C sort)
          have=$(printf '%s\n' "${nixl_wheels[@]##*/}" | LC_ALL=C sort)
          if [ "$listed" != "$have" ]; then
            reject "nixl-wheels.sha256 does not list exactly the NIXL backend wheels that were uploaded"
          fi
          if ! (cd "$nixl" && sha256sum --check --strict --quiet "$sums"); then
            reject "nixlbench was not built against the NIXL backend wheels that were uploaded"
          fi
          stage=$(mktemp -d "$RUNNER_TEMP/nixlbench-stage.XXXXXX")
          cp "$wheel" "$sums" "$stage/"
          WHEEL="$stage/$name" MANIFEST="$stage/nixlbench-backend.json" python3 -I - <<'EOF'
          import hashlib
          import json
          import os
          import pathlib

          wheel = pathlib.Path(os.environ["WHEEL"])
          manifest = {
              "schema": 1,
              "rocm": os.environ["ROCM_VERSION"],
              "sha": os.environ["SOURCE_SHA"],
              # <package>-<version>-<python tag>-<abi tag>-<platform tag>.whl
              "version": wheel.name.split("-")[1],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "wheel": wheel.name,
              "sha256": hashlib.sha256(wheel.read_bytes()).hexdigest(),
          }
          pathlib.Path(os.environ["MANIFEST"]).write_text(json.dumps(manifest, indent=1) + "\n")
          print(json.dumps(manifest))
          EOF
          mv "$stage" "$RUNNER_TEMP/nixlbench-upload"
          ls -l "$RUNNER_TEMP/nixlbench-upload"

      # The directory holds only what the check staged.
      - name: Upload the nixlbench backend wheel
        id: nixlbench-upload
        if: steps.nixlbench.outcome == 'success' && steps.nixlbench.outputs.built == 'true' && steps.nixlbench-check.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nixlbench-rocm-backend-${{ matrix.rocm-version }}${{ inputs.artifact-suffix }}
          path: ${{ runner.temp }}/nixlbench-upload/
          if-no-files-found: error
          overwrite: true

      - name: Report the nixlbench wheel
        if: ${{ !cancelled() && needs.plan.outputs.nixlbench == 'true' }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          BUILD_OUTCOME: ${{ steps.nixlbench.outcome }}
          BUILT: ${{ steps.nixlbench.outputs.built }}
          CHECK_OUTCOME: ${{ steps.nixlbench-check.outcome }}
          UPLOAD_OUTCOME: ${{ steps.nixlbench-upload.outcome }}
        run: |
          set +e
          problem=""
          if [ "$BUILD_OUTCOME" = "skipped" ] || [ -z "$BUILD_OUTCOME" ]; then
            problem="the build did not run, because an earlier step of this job failed"
          elif [ "$BUILD_OUTCOME" != "success" ]; then
            problem="the step \"Build the nixlbench wheel\" ended as ${BUILD_OUTCOME}"
          elif [ "$BUILT" != "true" ]; then
            problem="the build was skipped for lack of free disk space"
          elif [ "$CHECK_OUTCOME" != "success" ]; then
            problem="the step \"Check the nixlbench wheel\" ended as ${CHECK_OUTCOME:-not run}"
          elif [ "$UPLOAD_OUTCOME" != "success" ]; then
            problem="the step \"Upload the nixlbench backend wheel\" ended as ${UPLOAD_OUTCOME:-not run}"
          fi
          if [ -n "$problem" ]; then
            msg="No nixlbench backend wheel for ROCm ${ROCM_VERSION}: ${problem}. The nixlbench wheel is not required, so this does not fail the job."
            echo "::warning title=nixlbench wheel not built::${msg}"
            echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The nixlbench backend wheel for ROCm ${ROCM_VERSION} was built, checked and uploaded."
          fi
          exit 0

  # The wheels branch adds the ROCm path to the files NVIDIA's CUDA wheels are
  # built with (Dockerfile.manylinux, build-container.sh, build-wheel.sh), so
  # the CUDA wheel is built from the same commit, with no ROCm option, to see
  # that it still builds. One Python and one PyTorch: enough to go through
  # every stage. It is built, not run: no runner has an NVIDIA GPU. Not one of
  # the nightly's required jobs.
  cuda:
    name: CUDA build
    needs: plan
    if: needs.plan.outputs.supported == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CUDA_PYTHON_VERSION: '3.12'
      CUDA_TORCH_VERSION: '2.14'
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android \
            /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Expose the Actions cache to BuildKit
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      # As in the ROCm build: only the dependency stage is cached, and the plan
      # job decides which build writes the cache.
      - name: Build the dependency stage
        env:
          CACHE_SCOPE: cuda-wheel-base
          WRITE_CACHE: ${{ needs.plan.outputs.write-cache }}
        run: |
          set -euo pipefail
          cache="--cache-from type=gha,scope=${CACHE_SCOPE}"
          if [ "$WRITE_CACHE" = "true" ]; then
            cache+=" --cache-to type=gha,mode=max,ignore-error=true,scope=${CACHE_SCOPE}"
          fi
          DOCKER_BUILD_EXTRA_ARGS="--target wheel_base ${cache}" \
            ./contrib/build-container.sh \
              --dockerfile contrib/Dockerfile.manylinux \
              --python-versions "$CUDA_PYTHON_VERSION" \
              --tag nixl-wheel-base:cuda

      - name: Build the wheels
        run: |
          set -euo pipefail
          ./contrib/build-container.sh \
            --dockerfile contrib/Dockerfile.manylinux \
            --python-versions "$CUDA_PYTHON_VERSION" \
            --torch-versions "$CUDA_TORCH_VERSION" \
            --wheel-output-dir dist

      # What tells a CUDA wheel from one the ROCm path produced by mistake:
      # its name, its torch requirement, the CUDA-only plugins and nixl_ep.
      - name: Check the wheels
        run: |
          set -euo pipefail
          df -h /
          ls -l dist
          python3 -I - <<'EOF'
          import email.parser
          import pathlib
          import sys
          import zipfile

          errors = []
          dist = pathlib.Path("dist")
          backends = sorted(dist.glob("nixl_cu13-*.whl"))
          metas = sorted(dist.glob("nixl-*-py3-none-any.whl"))
          others = sorted(set(dist.glob("*.whl")) - set(backends) - set(metas))
          if len(backends) != 1:
              errors.append(f"expected one nixl_cu13 wheel, found {[p.name for p in backends]}")
          if len(metas) != 1:
              errors.append(f"expected one nixl meta wheel, found {[p.name for p in metas]}")
          if others:
              errors.append(f"unexpected wheels: {[p.name for p in others]}")


          def metadata(wheel, names):
              (member,) = [n for n in names if n.endswith(".dist-info/METADATA")]
              return email.parser.BytesHeaderParser().parsebytes(wheel.read(member))


          for path in backends:
              with zipfile.ZipFile(path) as wheel:
                  names = wheel.namelist()
                  headers = metadata(wheel, names)
              plugins = {
                  pathlib.PurePosixPath(n).name[len("libplugin_"):-len(".so")]
                  for n in names
                  if "/plugins/libplugin_" in n and n.endswith(".so")
              }
              print(f"{path.name}: plugins {', '.join(sorted(plugins))}")
              missing = {"UCX", "POSIX", "LIBFABRIC", "GDS", "OBJ"} - plugins
              if missing:
                  errors.append(f"{path.name}: no {', '.join(sorted(missing))} plugin")
              if headers["Name"] != "nixl-cu13":
                  errors.append(f"{path.name}: METADATA Name is {headers['Name']}")
              requires = [r.split(";")[0].strip() for r in headers.get_all("Requires-Dist") or []]
              if "torch" not in requires:
                  errors.append(f"{path.name}: does not require torch ({requires})")
              if not any(n.startswith("nixl_ep_cu13/") and n.endswith(".so") for n in names):
                  errors.append(f"{path.name}: no nixl_ep_cu13 extension")
              if any(n.split("/")[0].startswith("nixl_rocm") for n in names):
                  errors.append(f"{path.name}: holds a ROCm package")
          for path in metas:
              with zipfile.ZipFile(path) as wheel:
                  headers = metadata(wheel, wheel.namelist())
              requires = headers.get_all("Requires-Dist") or []
              print(f"{path.name}: requires {requires}")
              if not any(r.startswith("nixl-cu13==") for r in requires):
                  errors.append(f"{path.name}: does not require nixl-cu13 ({requires})")
          for error in errors:
              print(f"::error::{error}")
          sys.exit(1 if errors else 0)
          EOF

  build-unit-tests:
    name: Build unit tests (${{ matrix.rocm-version }})
    needs: plan
    if: needs.plan.outputs.supported == 'true' && needs.plan.outputs.run-vm-tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        rocm-version: ${{ fromJSON(needs.plan.outputs.rocm-versions) }}
    permissions:
      contents: read
    steps:
    - name: Check out code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Build test image
      run: |
        set -euo pipefail
        docker build \
          --build-arg ROCM_VERSION="${{ matrix.rocm-version }}" \
          --target package \
          -t nixl-tests:local \
          -f contrib/Dockerfile.tests .

    - name: Extract test binaries
      run: |
        set -euo pipefail
        mkdir -p dist-tests
        docker run --rm nixl-tests:local \
            tar -cC /nixl-tests . \
          | tar -xC dist-tests
        ls -lR dist-tests

    - name: Upload test binaries
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: nixl-unit-tests-${{ matrix.rocm-version }}${{ inputs.artifact-suffix }}
        path: dist-tests/
        if-no-files-found: error

  merge:
    name: Merge
    needs: [plan, build]
    if: needs.plan.outputs.supported == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Download the backend wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rocm-backend-wheels-*${{ inputs.artifact-suffix }}
          path: backend-artifacts

      # The pattern also matches another ref's artifacts when its suffix ends
      # with this one, so the artifacts are taken by their exact names.
      - name: Collect this build's backend wheels
        env:
          ROCM_VERSIONS: ${{ needs.plan.outputs.rocm-versions }}
          ARTIFACT_SUFFIX: ${{ inputs.artifact-suffix }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir backends
          for version in $(python3 -I -c 'import json, sys; print(" ".join(json.loads(sys.argv[1])))' "$ROCM_VERSIONS"); do
            dir="backend-artifacts/rocm-backend-wheels-${version}${ARTIFACT_SUFFIX}"
            wheels=("$dir"/*.whl)
            if [ "${#wheels[@]}" -eq 0 ]; then
              # A lone matching artifact may be extracted without its directory.
              wheels=(backend-artifacts/"nixl_rocm$(echo "$version" | cut -d. -f1,2 | tr . _)"-*.whl)
            fi
            if [ "${#wheels[@]}" -eq 0 ]; then
              echo "::error::artifact rocm-backend-wheels-${version}${ARTIFACT_SUFFIX} was not downloaded or holds no wheel"
              ls -lR backend-artifacts
              exit 1
            fi
            mv "${wheels[@]}" backends/
          done

      # One nixl_rocm wheel per Python tag, holding the backend of every ROCm
      # version this run built.
      - name: Merge the backends
        env:
          # Set only when the version was stamped.
          STAMPED_VERSION: ${{ inputs.version-suffix != '' && needs.plan.outputs.version || '' }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ls -l backends
          wheels=(backends/nixl_rocm*.whl)
          if [ "${#wheels[@]}" -eq 0 ]; then
            echo "::error::no backend wheels were downloaded"
            exit 1
          fi
          # <package>-<version>-<python tag>-<abi tag>-<platform tag>.whl
          rocm_count=$(printf '%s\n' "${wheels[@]##*/}" | cut -d- -f1 | sort -u | wc -l)
          tags=$(printf '%s\n' "${wheels[@]##*/}" | cut -d- -f3 | sort -u)
          for tag in $tags; do
            group=(backends/nixl_rocm*-"${tag}"-*.whl)
            if [ "${#group[@]}" -ne "$rocm_count" ]; then
              echo "::error::${tag} has ${#group[@]} backend wheel(s) but ${rocm_count} ROCm version(s) were built: ${group[*]}"
              exit 1
            fi
            python3 contrib/wheel_merge_rocm.py --output-dir dist-merged "${group[@]}"
          done
          ls -l dist-merged
          merged=(dist-merged/nixl_rocm-*.whl)
          if [ "${#merged[@]}" -ne "$(wc -w <<< "$tags")" ]; then
            echo "::error::expected one nixl_rocm wheel per Python tag (${tags//$'\n'/ }), found ${#merged[@]}"
            exit 1
          fi
          if [ -n "$STAMPED_VERSION" ]; then
            for wheel in "${merged[@]}"; do
              case "${wheel##*/}" in
                "nixl_rocm-${STAMPED_VERSION}-"*) ;;
                *)
                  echo "::error::${wheel} does not carry the stamped version ${STAMPED_VERSION}"
                  exit 1
                  ;;
              esac
            done
          fi

      # The extras are what keep pip from pairing nixl-rocm with PyPI's CUDA
      # torch. Read from the metadata; torch itself is never downloaded.
      - name: Check the merged wheels' requirements
        run: |
          set -euo pipefail
          python3 -I - dist-merged/nixl_rocm-*.whl <<'EOF'
          import email
          import re
          import sys
          import zipfile

          failed = False
          for path in sys.argv[1:]:
              with zipfile.ZipFile(path) as wheel:
                  names = wheel.namelist()
                  (metadata_name,) = [
                      n for n in names if re.fullmatch(r"nixl_rocm-[^/]+\.dist-info/METADATA", n)
                  ]
                  metadata = email.message_from_bytes(wheel.read(metadata_name))
              rocm = sorted(
                  {m.group(1).replace("_", ".") for n in names if (m := re.match(r"nixl_rocm(\d+_\d+)/", n))}
              )
              extras = sorted(metadata.get_all("Provides-Extra") or [])
              unconditional, pins = [], {}
              for requirement in metadata.get_all("Requires-Dist") or []:
                  spec, _, marker = (part.strip() for part in requirement.partition(";"))
                  extra = re.search(r"extra\s*==\s*.(rocm\d+[._-]\d+)", marker)
                  if extra:
                      pins[extra.group(1)] = spec
                  else:
                      unconditional.append(spec)
              problems = []
              if metadata["Name"] != "nixl-rocm":
                  problems.append(f"Name is {metadata['Name']}")
              if [re.split(r"[^A-Za-z0-9._-]", spec)[0].lower() for spec in unconditional] != ["numpy"]:
                  problems.append(f"unconditional requirements are {unconditional}, expected numpy only")
              if not rocm:
                  problems.append("no nixl_rocm<X>_<Y> backend package")
              if [re.sub(r"[._-]", ".", extra) for extra in extras] != [f"rocm{xy}" for xy in rocm]:
                  problems.append(f"extras are {extras}, expected one per backend ({rocm})")
              for xy in rocm:
                  spec = next((s for e, s in pins.items() if re.sub(r"[._-]", ".", e) == f"rocm{xy}"), "")
                  if not re.fullmatch(rf"torch\s*==\s*[0-9.]+\+rocm{re.escape(xy)}\.\d+", spec):
                      problems.append(f"extra rocm{xy} requires '{spec}', expected torch==<version>+rocm{xy}.<Z>")
              for problem in problems:
                  failed = True
                  print(f"::error::{path}: {problem}")
              print(f"{path}: backends {rocm}; requires {unconditional}; extras {pins}")
          sys.exit(1 if failed else 0)
          EOF

      - name: Upload the merged wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.plan.outputs.wheels-artifact }}
          path: dist-merged/nixl_rocm-*.whl
          if-no-files-found: error

  test:
    name: Test (ROCm ${{ matrix.rocm-version }})
    needs: [plan, merge]
    if: needs.plan.outputs.supported == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rocm-version: ${{ fromJSON(needs.plan.outputs.rocm-versions) }}
    container:
      image: ubuntu:24.04
    defaults:
      run:
        shell: bash
    env:
      ROCM_VERSION: ${{ matrix.rocm-version }}
    steps:
      - name: Install Python and the ROCm runtime
        run: |
          set -euo pipefail
          rocm_xy=${ROCM_VERSION%.*}
          if [ "${ROCM_VERSION%%.*}" = "7" ]; then
            repo=https://repo.amd.com/rocm/packages-multi-arch/ubuntu2404
            key=https://repo.amd.com/rocm/packages-multi-arch/gpg/rocm.gpg
          else
            repo=https://stable.repo.amd.com/rocm/core/packages/ubuntu2404
            key=https://stable.repo.amd.com/rocm/gpg/packages.gpg
          fi
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl python3 python3-venv
          install -d /etc/apt/keyrings
          curl -fsSL "$key" -o /etc/apt/keyrings/amdrocm.asc
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/amdrocm.asc] ${repo} stable main" \
            > /etc/apt/sources.list.d/amdrocm.list
          apt-get update
          packages=()
          for package in base sysdeps llvm runtime hipfile; do
            packages+=("amdrocm-${package}${rocm_xy}=${ROCM_VERSION}-*")
          done
          apt-get install -y --no-install-recommends "${packages[@]}"
          # The component packages only populate /opt/rocm/core-<X.Y>.
          rocm_path=/opt/rocm/core-${rocm_xy}
          cat "${rocm_path}/.info/version"
          {
            echo "ROCM_XY=${rocm_xy}"
            echo "ROCM_PATH=${rocm_path}"
            echo "LD_LIBRARY_PATH=${rocm_path}/lib"
          } >> "$GITHUB_ENV"

      # Only the CI scripts are used, which always come from the commit this
      # workflow file was read from, whatever ref the wheels were built from.
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download the merged wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.plan.outputs.wheels-artifact }}
          path: wheelhouse

      # numpy is the only package taken from an index. The wheel is resolved
      # with no index, so any other requirement it declared would fail here.
      - name: Install the merged wheel
        run: |
          set -euo pipefail
          ls -l wheelhouse
          python3 -m venv venv
          venv/bin/python -m pip install numpy
          venv/bin/python -m pip install --no-index --find-links wheelhouse nixl-rocm

      - name: Check that torch is not installed
        run: |
          venv/bin/python -m pip list
          if venv/bin/python -m pip show torch > /dev/null 2>&1; then
            echo "::error::torch was installed with nixl-rocm"
            exit 1
          fi

      - name: Run the smoke test
        run: |
          mkdir -p check-results
          env -u NIXL_PLUGIN_DIR venv/bin/python .ci/scripts/rocm_wheel_smoke_test.py \
            --expect-rocm "$ROCM_XY" --json-out check-results/smoke.json

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rocm-check-results-test-${{ matrix.rocm-version }}${{ inputs.artifact-suffix }}
          path: check-results/*.json
          if-no-files-found: ignore

  rocjitsu:
    name: rocjitsu (ROCm ${{ matrix.rocm-version }})
    needs: [plan, merge]
    if: needs.plan.outputs.supported == 'true' && needs.plan.outputs.run-vm-tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        rocm-version: ${{ fromJSON(needs.plan.outputs.rocm-versions) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/rocm-wheels-rocjitsu.yml
    with:
      rocm-version: ${{ matrix.rocm-version }}
      artifact-name: ${{ needs.plan.outputs.wheels-artifact }}
      python-version: ${{ needs.plan.outputs.test-python }}
      artifact-suffix: ${{ inputs.artifact-suffix }}
      source-ref: ${{ needs.plan.outputs.sha }}

  # allow-failure: a failure here is a warning on the run, not a failed job.
  rocjitsu-2vm:
    name: rocjitsu two guests (ROCm ${{ matrix.rocm-version }})
    needs: [plan, merge]
    if: needs.plan.outputs.supported == 'true' && needs.plan.outputs.run-vm-tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        rocm-version: ${{ fromJSON(needs.plan.outputs.rocm-versions) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/rocm-wheels-rocjitsu-2vm.yml
    with:
      rocm-version: ${{ matrix.rocm-version }}
      artifact-name: ${{ needs.plan.outputs.wheels-artifact }}
      python-version: ${{ needs.plan.outputs.test-python }}
      allow-failure: true
      artifact-suffix: ${{ inputs.artifact-suffix }}

  # Not required: no job that gates the wheels needs this one, and a failure
  # allow-failure: unit tests are still experimental.
  unit:
    name: unit (${{ matrix.rocm-version }})
    needs: [plan, build-unit-tests]
    if: needs.plan.outputs.supported == 'true' && needs.plan.outputs.run-vm-tests == 'true'
    strategy:
      fail-fast: false
      matrix:
        rocm-version: ${{ fromJSON(needs.plan.outputs.rocm-versions) }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/rocm-wheels-rocjitsu-unit.yml
    with:
      rocm-version: ${{ matrix.rocm-version }}
      artifact-name: nixl-unit-tests-${{ matrix.rocm-version }}${{ inputs.artifact-suffix }}
      allow-failure: true
      artifact-suffix: ${{ inputs.artifact-suffix }}

  # here is a warning on the run, not a failed job. It merges the nixlbench
  # backend wheels the build job uploaded into one nixlbench-rocm wheel, after
  # checking each of them again against the NIXL backend wheels of this
  # attempt: a backend left by an earlier attempt of the run, built against
  # other NIXL wheels, is dropped. Every step after the checkout is
  # continue-on-error and runs only while the steps it depends on succeeded.
  nixlbench:
    name: nixlbench wheel
    needs: [plan, build, merge]
    if: ${{ !cancelled() && needs.plan.outputs.nixlbench == 'true' && needs.merge.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # For what no step can report, such as the job timing out.
    continue-on-error: true
    permissions:
      contents: read
    env:
      SOURCE_SHA: ${{ needs.plan.outputs.sha }}
      VERSION: ${{ needs.plan.outputs.version }}
      ARTIFACT_SUFFIX: ${{ inputs.artifact-suffix }}
    steps:
      # The whole source: the merge installs the dispatcher under benchmark/.
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Download the nixlbench backend wheels
        id: download-nixlbench
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nixlbench-rocm-backend-*${{ inputs.artifact-suffix }}
          path: ${{ runner.temp }}/nixlbench-artifacts

      - name: Download the backend wheels
        id: download-nixl
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rocm-backend-wheels-*${{ inputs.artifact-suffix }}
          path: ${{ runner.temp }}/backend-artifacts

      # The patterns also match another ref's artifacts when its suffix ends
      # with this one, so the artifacts are taken by their exact names.
      - name: Verify the nixlbench backends
        id: verify
        continue-on-error: true
        env:
          ROCM_VERSIONS: ${{ needs.plan.outputs.rocm-versions }}
        run: |
          set -euo pipefail
          python3 -I - <<'EOF'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          suffix = os.environ.get("ARTIFACT_SUFFIX", "")
          sha = os.environ["SOURCE_SHA"]
          version = os.environ["VERSION"]
          bench_root = temp / "nixlbench-artifacts"
          nixl_root = temp / "backend-artifacts"
          MANIFEST = "nixlbench-backend.json"
          SUMS = "nixl-wheels.sha256"


          class Missing(Exception):
              """The run has no nixlbench backend for a ROCm version."""


          class Dropped(Exception):
              """A nixlbench backend that must not be merged."""


          def verify(rocm):
              xy = "_".join(rocm.split(".")[:2])
              artifact = f"nixlbench-rocm-backend-{rocm}{suffix}"
              directory = bench_root / artifact
              lone = False
              if not directory.is_dir():
                  # A lone matching artifact may be extracted without its directory.
                  directory, lone = bench_root, True
                  if not list(directory.glob(f"nixlbench_rocm{xy}-*.whl")):
                      raise Missing(f"artifact {artifact} was not downloaded")
              try:
                  manifest = json.loads((directory / MANIFEST).read_text())
              except (OSError, ValueError) as exc:
                  raise Dropped(f"{MANIFEST} cannot be read: {exc}") from None
              if not isinstance(manifest, dict) or manifest.get("schema") != 1:
                  raise Dropped(f"{MANIFEST} is not a schema 1 manifest")
              if lone and manifest.get("rocm") != rocm:
                  raise Missing(f"artifact {artifact} was not downloaded")
              for key, expected in (("rocm", rocm), ("sha", sha), ("version", version)):
                  if manifest.get(key) != expected:
                      raise Dropped(f"{MANIFEST} has {key} {manifest.get(key)!r}, this build has {expected!r}")
              attempt = manifest.get("run_attempt")
              if isinstance(attempt, bool) or not isinstance(attempt, int):
                  raise Dropped(f"{MANIFEST} has no integer run_attempt")
              name = manifest.get("wheel")
              if not isinstance(name, str) or not re.fullmatch(
                  rf"nixlbench_rocm{xy}-{re.escape(version)}-py3-none-[A-Za-z0-9_.]+\.whl", name
              ):
                  raise Dropped(f"{MANIFEST} names the wheel {name!r}, which is not this build's backend")
              wheel = directory / name
              found = sorted(p.name for p in directory.glob(f"nixlbench_rocm{xy}-*.whl"))
              if found != [name]:
                  raise Dropped(f"the artifact holds {found}, expected {name} only")
              digest = hashlib.sha256(wheel.read_bytes()).hexdigest()
              if manifest.get("sha256") != digest:
                  raise Dropped(f"{name} does not have the sha256 its manifest records")

              # The NIXL backend wheels of the same ROCm version, as merged.
              nixl_artifact = f"rocm-backend-wheels-{rocm}{suffix}"
              nixl_dir = nixl_root / nixl_artifact
              nixl_wheels = sorted(p.name for p in nixl_dir.glob("*.whl"))
              if not nixl_wheels:
                  nixl_dir = nixl_root
                  nixl_wheels = sorted(p.name for p in nixl_dir.glob(f"nixl_rocm{xy}-*.whl"))
              if not nixl_wheels:
                  raise Dropped(f"artifact {nixl_artifact} was not downloaded or holds no wheel")
              sums = directory / SUMS
              try:
                  lines = sums.read_text().splitlines()
              except (OSError, ValueError) as exc:
                  raise Dropped(f"{SUMS} cannot be read: {exc}") from None
              listed = []
              for line in lines:
                  match = re.fullmatch(r"[0-9a-f]{64} [ *]([^/]+)", line)
                  if not match:
                      raise Dropped(f"{SUMS} has a line that is not '<sha256>  <wheel>'")
                  listed.append(match.group(1))
              if not listed or sorted(listed) != nixl_wheels:
                  raise Dropped(f"{SUMS} does not list exactly the {len(nixl_wheels)} wheel(s) of {nixl_artifact}")
              check = subprocess.run(
                  ["sha256sum", "--check", "--strict", "--quiet", str(sums.resolve())],
                  cwd=nixl_dir,
                  check=False,
              )
              if check.returncode != 0:
                  raise Dropped(f"it was not built against the NIXL wheels of {nixl_artifact}")
              return {
                  "rocm": rocm,
                  "path": str(wheel.resolve()),
                  "file": name,
                  "sha256": digest,
                  "run_attempt": attempt,
              }


          verified = []
          for rocm in json.loads(os.environ["ROCM_VERSIONS"]):
              try:
                  verified.append(verify(rocm))
                  print(f"ROCm {rocm}: {verified[-1]['file']} is verified")
              except Missing as exc:
                  print(f"::warning title=nixlbench backend missing::ROCm {rocm}: {exc}")
              except Dropped as exc:
                  print(f"::warning title=nixlbench backend dropped::ROCm {rocm}: {exc}")

          (temp / "nixlbench-verified.json").write_text(json.dumps(verified) + "\n")
          (temp / "nixlbench-verified.txt").write_text("".join(entry["path"] + "\n" for entry in verified))
          if not verified:
              print("::warning title=nixlbench wheel not built::no nixlbench backend is left to merge")
          with open(os.environ["GITHUB_OUTPUT"], "a") as stream:
              stream.write(f"count={len(verified)}\n")
          EOF

      # One nixlbench_rocm wheel, holding the backend of every ROCm version
      # that was verified.
      - name: Merge the nixlbench backends
        id: merge
        if: steps.verify.outcome == 'success' && steps.verify.outputs.count != '' && steps.verify.outputs.count != '0'
        continue-on-error: true
        run: |
          set -euo pipefail
          shopt -s nullglob
          mapfile -t backends < "$RUNNER_TEMP/nixlbench-verified.txt"
          out="$RUNNER_TEMP/dist-nixlbench"
          python3 contrib/wheel_nixlbench.py merge --output-dir "$out" "${backends[@]}"
          ls -l "$out"
          merged=("$out"/*.whl)
          if [ "${#merged[@]}" -ne 1 ] || [[ "${merged[0]##*/}" != "nixlbench_rocm-${VERSION}-py3-none-"*.whl ]]; then
            echo "::warning title=nixlbench wheel not built::expected one nixlbench_rocm wheel of version ${VERSION}, found: ${merged[*]##*/}"
            exit 1
          fi

      - name: Write nixlbench-build.json
        id: manifest
        if: steps.merge.outcome == 'success'
        continue-on-error: true
        env:
          REF: ${{ needs.plan.outputs.ref }}
          NIXL_WHEELS_ARTIFACT: ${{ needs.plan.outputs.wheels-artifact }}
        run: |
          set -euo pipefail
          python3 -I - <<'EOF'
          import hashlib
          import json
          import os
          import pathlib

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          verified = json.loads((temp / "nixlbench-verified.json").read_text())
          (wheel,) = sorted((temp / "dist-nixlbench").glob("*.whl"))
          manifest = {
              "schema": 1,
              "ref": os.environ["REF"],
              "sha": os.environ["SOURCE_SHA"],
              "version": os.environ["VERSION"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "artifact_suffix": os.environ.get("ARTIFACT_SUFFIX", ""),
              "nixl_wheels_artifact": os.environ["NIXL_WHEELS_ARTIFACT"],
              "wheel": wheel.name,
              "bytes": wheel.stat().st_size,
              "sha256": hashlib.sha256(wheel.read_bytes()).hexdigest(),
              # In the order of the plan's ROCm versions.
              "rocm": [entry["rocm"] for entry in verified],
              "backends": [
                  {
                      "rocm": entry["rocm"],
                      "file": entry["file"],
                      "sha256": entry["sha256"],
                      "run_attempt": entry["run_attempt"],
                  }
                  for entry in verified
              ],
          }
          (wheel.parent / "nixlbench-build.json").write_text(json.dumps(manifest, indent=1) + "\n")
          print(json.dumps(manifest, indent=1))
          EOF

      # The wheel and its manifest: the merge wrote nothing else there.
      - name: Upload the nixlbench wheel
        id: upload
        if: steps.manifest.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nixlbench-rocm-wheel${{ inputs.artifact-suffix }}
          path: ${{ runner.temp }}/dist-nixlbench/
          if-no-files-found: error
          overwrite: true

      - name: Report
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          OUTCOMES: >-
            checkout=${{ steps.checkout.outcome }}
            download-nixlbench=${{ steps.download-nixlbench.outcome }}
            download-nixl=${{ steps.download-nixl.outcome }}
            verify=${{ steps.verify.outcome }}
            merge=${{ steps.merge.outcome }}
            manifest=${{ steps.manifest.outcome }}
            upload=${{ steps.upload.outcome }}
          COUNT: ${{ steps.verify.outputs.count }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set +e
          failed=""
          for pair in $OUTCOMES; do
            if [ "${pair#*=}" = "failure" ]; then failed+=" ${pair%%=*}"; fi
          done
          if [ -n "$failed" ]; then
            msg="The nixlbench-rocm wheel was not built: these steps failed:${failed}. It is not required, so this does not fail the job."
            echo "::warning title=nixlbench wheel not built::${msg}"
          elif [ "$UPLOAD_OUTCOME" = "success" ]; then
            msg="The nixlbench-rocm wheel (not required) was built from ${COUNT} verified backend(s) and uploaded as nixlbench-rocm-wheel${ARTIFACT_SUFFIX}."
            echo "${msg}"
          else
            # The verify step has already warned, with the cause.
            msg="The nixlbench-rocm wheel (not required) was not built: no nixlbench backend passed verification."
            echo "${msg}"
          fi
          echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
          exit 0

  # Runs whatever happened above, including for a ref that cannot build ROCm
  # wheels, so that a caller always finds one results.json per ref.
  results:
    name: Results
    needs: [plan, build, cuda, build-unit-tests, merge, test, rocjitsu, rocjitsu-2vm, unit, nixlbench]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download the merged wheels
        if: needs.merge.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.plan.outputs.wheels-artifact }}
          path: wheels

      - name: Download the test results
        if: needs.plan.outputs.supported == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rocm-check-results-*${{ inputs.artifact-suffix }}
          path: check-results

      # The needs context has each job's result but not how long it took.
      - name: List this run's jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" \
            --jq '.jobs[] | {id, name, conclusion, started_at, completed_at} | @json' > jobs.jsonl \
            || { echo "::warning::could not list the run's jobs; durations are left out"; : > jobs.jsonl; }
          wc -l jobs.jsonl

      - name: Write results.json
        env:
          NEEDS: ${{ toJSON(needs) }}
          REF: ${{ needs.plan.outputs.ref || inputs.ref }}
          ARTIFACT_SUFFIX: ${{ inputs.artifact-suffix }}
          CHECK_RUN_ID: ${{ job.check_run_id }}
        run: |
          set -euo pipefail
          mkdir -p results
          python3 -I - <<'EOF'
          import datetime
          import hashlib
          import json
          import os
          import pathlib
          import re
          import zipfile

          # Job id to the start of its name in the jobs API; a matrix or a
          # called workflow adds the rest.
          JOBS = {
              "plan": "Plan",
              "build": "Build (",
              "merge": "Merge",
              "test": "Test (",
              "rocjitsu": "rocjitsu (",
              "rocjitsu-2vm": "rocjitsu two guests (",
              "unit": "unit (",
              "cuda": "CUDA build",
          }
          OWN_NAME = "Results"

          needs = json.loads(os.environ["NEEDS"])
          plan = (needs.get("plan") or {}).get("outputs") or {}
          suffix = os.environ.get("ARTIFACT_SUFFIX", "")
          ref = os.environ.get("REF") or os.environ["GITHUB_REF_NAME"]
          supported = plan.get("supported") == "true"
          try:
              rocm_versions = json.loads(plan.get("rocm-versions") or "[]")
          except ValueError:
              rocm_versions = []


          def when(stamp):
              if not stamp:
                  return None
              return datetime.datetime.fromisoformat(stamp.replace("Z", "+00:00"))


          # A job of a called workflow is listed as "<caller job> / <name>".
          # This job's own entry gives the caller's part, which is what tells
          # this call's jobs from those of the other calls in the same run.
          listed = [json.loads(line) for line in pathlib.Path("jobs.jsonl").read_text().splitlines() if line.strip()]
          own = [j for j in listed if str(j["id"]) == os.environ.get("CHECK_RUN_ID", "")]
          prefix = None
          if own and own[0]["name"].endswith(OWN_NAME):
              prefix = own[0]["name"][: -len(OWN_NAME)]
          elif listed:
              print("::warning::this job is not in the run's job list; durations are left out")


          def duration(start_of_name):
              if prefix is None:
                  return None
              spans = []
              for job in listed:
                  if not job["name"].startswith(prefix) or job["conclusion"] in (None, "skipped"):
                      continue
                  name = job["name"][len(prefix):]
                  if start_of_name.endswith("("):
                      mine = name.startswith(start_of_name)
                  else:
                      mine = name == start_of_name
                  if not mine:
                      continue
                  start, end = when(job["started_at"]), when(job["completed_at"])
                  if start and end:
                      spans.append((start, end))
              if not spans:
                  return None
              return round((max(e for _, e in spans) - min(s for s, _ in spans)).total_seconds(), 1)


          jobs = [
              {"name": name, "result": (needs.get(name) or {}).get("result"), "duration_s": duration(start)}
              for name, start in JOBS.items()
          ]

          wheels = []
          for path in sorted(pathlib.Path("wheels").glob("*.whl")):
              digest = hashlib.sha256()
              with open(path, "rb") as stream:
                  for block in iter(lambda: stream.read(1 << 20), b""):
                      digest.update(block)
              with zipfile.ZipFile(path) as wheel:
                  rocm = sorted(
                      {m.group(1).replace("_", ".") for n in wheel.namelist() if (m := re.match(r"nixl_rocm(\d+_\d+)/", n))},
                      key=lambda xy: [int(part) for part in xy.split(".")],
                  )
              tag = re.search(r"-cp(\d)(\d+)-", path.name)
              wheels.append(
                  {
                      "file": path.name,
                      "bytes": path.stat().st_size,
                      "sha256": digest.hexdigest(),
                      "python": f"{tag.group(1)}.{tag.group(2)}" if tag else None,
                      "rocm": rocm,
                  }
              )

          tests = []
          for job in ("test", "rocjitsu", "rocjitsu-2vm", "unit"):
              for version in rocm_versions:
                  directory = pathlib.Path("check-results") / f"rocm-check-results-{job}-{version}{suffix}"
                  for path in sorted(directory.glob("*.json")):
                      try:
                          record = json.loads(path.read_text())
                          entry = {
                              "job": job,
                              "rocm": version,
                              "script": record.get("script"),
                              "checks": record.get("checks") or [],
                          }
                      except (ValueError, AttributeError) as exc:
                          print(f"::warning::{path} is not a test result: {exc}")
                          continue
                      # One script, several runs: the stage and the role.
                      if job == "rocjitsu-2vm":
                          entry["label"] = path.stem
                      tests.append(entry)

          results = {
              "schema": 1,
              "ref": ref,
              "sha": plan.get("sha") or None,
              "version": plan.get("version") or None,
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "supported": supported,
              "jobs": jobs,
              "wheels": wheels,
              "tests": tests,
          }
          pathlib.Path("results/results.json").write_text(json.dumps(results, indent=1) + "\n")
          print(
              f"{ref}: supported={supported}, {len(wheels)} wheel(s), {len(tests)} test result file(s), "
              + ", ".join(f"{j['name']}={j['result']}" for j in jobs)
          )
          EOF

      # The nixlbench wheel is not required. The two steps below cannot fail
      # the job and each has a short time limit, so neither can keep the
      # results.json written above from being uploaded.
      - name: Download the nixlbench wheel
        if: needs.plan.outputs.nixlbench == 'true'
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nixlbench-rocm-wheel${{ inputs.artifact-suffix }}
          path: nixlbench

      # Adds the top-level key "nixlbench" and nothing else. The file is
      # replaced in one rename, and only by a copy that still holds every
      # other key as it was; on any error it is left as it is.
      - name: Add the nixlbench wheel to results.json
        continue-on-error: true
        timeout-minutes: 1
        env:
          NIXLBENCH_PRESENT: ${{ needs.plan.outputs.nixlbench-present }}
          NIXLBENCH_ENABLED: ${{ needs.plan.outputs.nixlbench }}
          NIXLBENCH_RESULT: ${{ needs.nixlbench.result }}
          NIXLBENCH_ARTIFACT: nixlbench-rocm-wheel${{ inputs.artifact-suffix }}
        run: |
          set -euo pipefail
          python3 -I - <<'EOF'
          import hashlib
          import json
          import os
          import pathlib

          path = pathlib.Path("results/results.json")
          original = json.loads(path.read_text())
          if not isinstance(original, dict) or "nixlbench" in original:
              raise SystemExit(f"{path} is not the object the step above writes")

          # What was built comes from the artifact, not from the job's result.
          directory = pathlib.Path("nixlbench")
          wheel = None
          rocm = []
          found = sorted(directory.glob("nixlbench_rocm-*.whl"))
          if len(found) == 1:
              digest = hashlib.sha256()
              with open(found[0], "rb") as stream:
                  for block in iter(lambda: stream.read(1 << 20), b""):
                      digest.update(block)
              wheel = {"file": found[0].name, "bytes": found[0].stat().st_size, "sha256": digest.hexdigest()}
              try:
                  manifest = json.loads((directory / "nixlbench-build.json").read_text())
              except (OSError, ValueError) as exc:
                  print(f"::warning::nixlbench-build.json cannot be read: {exc}")
                  manifest = None
              if isinstance(manifest, dict) and manifest.get("sha256") == wheel["sha256"]:
                  listed = manifest.get("rocm")
                  if isinstance(listed, list) and all(isinstance(version, str) for version in listed):
                      rocm = listed
          elif found:
              print(f"::warning::the nixlbench artifact holds {len(found)} wheels; none is reported")

          entry = {
              "required": False,
              "supported": os.environ.get("NIXLBENCH_PRESENT") == "true",
              "enabled": os.environ.get("NIXLBENCH_ENABLED") == "true",
              "result": os.environ.get("NIXLBENCH_RESULT") or None,
              "artifact": os.environ["NIXLBENCH_ARTIFACT"] if wheel else None,
              "wheel": wheel,
              "rocm": rocm,
          }
          updated = dict(original)
          updated["nixlbench"] = entry
          temporary = path.with_name(path.name + ".tmp")
          temporary.write_text(json.dumps(updated, indent=1) + "\n")
          written = json.loads(temporary.read_text())
          if written != updated or {key: written[key] for key in original} != original:
              raise SystemExit(f"{temporary} does not hold what {path} held")
          os.replace(temporary, path)

          if wheel:
              state = f"{wheel['file']} for ROCm {', '.join(rocm) or 'unknown'}"
          elif not entry["supported"]:
              state = "this source has no nixlbench wheel build"
          elif not entry["enabled"]:
              state = "not built in this run"
          else:
              state = f"no wheel (job result: {entry['result']})"
          line = f"nixlbench wheel (not required): {state}"
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as stream:
              stream.write(line + "\n")
          EOF

      - name: Upload the results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rocm-results${{ inputs.artifact-suffix }}
          path: results/results.json
          if-no-files-found: error
