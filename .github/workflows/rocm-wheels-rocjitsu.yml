name: ROCm Wheels - rocjitsu Smoke Test

# Runs .ci/scripts/rocm_wheel_smoke_test.py with its GPU and AIS checks in a
# QEMU guest that has an emulated AMD GPU (rocjitsu) and a spare NVMe drive.
# The script and the fleet overlay are those of the commit this workflow runs
# at, whatever source the wheels in the artifact were built from.
#
# External dependencies besides the actions pinned below and uv from PyPI:
#   - github.com/sbates130272/qemu-tool-action at the SHA pinned below, which
#     installs qemu-tool, boots the guest, binds its GPU and takes it down.
#   - github.com/sbates130272/qemu-minimal at QEMU_MINIMAL_REF, fetched by the
#     action: qemu-tool and its rocm-golden fleet file.
#   - PyPI: what the action installs qemu-tool with in a virtual environment
#     of its own, and setuptools and one dependency when the qemu container
#     starts.
#   - The runner's Ubuntu archive, for a host package the action finds missing,
#     and github.com/oras-project/oras releases for oras, which the action
#     checks against its sha256.
#   - The Docker Hub images under docker.io/sbates130272 that
#     .ci/rocjitsu/fleet-overlay-common.xml pins by digest: QEMU, the device
#     servers and the guest disk.

on:
  workflow_call:
    inputs:
      rocm-version:
        description: ROCm version of the backend to exercise, as X.Y.Z.
        required: true
        type: string
      artifact-name:
        description: Name of the artifact holding the merged rocm-nixl wheels.
        required: true
        type: string
      python-version:
        description: Python version to install the wheel for, as X.Y.
        required: false
        type: string
        default: '3.12'
      artifact-suffix:
        description: Appended to the names of the artifacts this workflow uploads, for a run that tests several builds.
        required: false
        type: string
        default: ''
      source-ref:
        description: Commit the wheels were built from. Its Python tests and examples are run; empty skips them.
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      rocm-version:
        description: ROCm version of the backend to exercise, as X.Y.Z.
        required: true
        type: string
        default: '10.2.0'
      artifact-name:
        description: Name of the artifact holding the merged rocm-nixl wheels.
        required: true
        type: string
        default: rocm-nixl-wheels
      python-version:
        description: Python version to install the wheel for, as X.Y.
        required: false
        type: string
        default: '3.12'
      run-id:
        description: Workflow run to download the artifact from.
        required: true
        type: string
      source-ref:
        description: Commit the wheels were built from. Its Python tests and examples are run; empty skips them.
        required: false
        type: string
        default: ''

# actions: read is for the workflow_dispatch path only, which downloads the
# artifact from another run.
permissions:
  contents: read
  actions: read

env:
  # The ROCm release in the guest of the pinned qemu-tool; only its backend
  # can be selected.
  GUEST_ROCM: '10.2'
  # The qemu-tool the action installs. It moves together with the
  # qemu-tool-action pin in the steps and the four image refs of
  # .ci/rocjitsu/fleet-overlay-common.xml, here and in the other three
  # workflows that boot guests.
  QEMU_MINIMAL_REF: 992b812f7391058ff411c2861547de2d57f3d6ba # v3.0.0
  # Under the directory the action creates for the runner's user.
  STACK_DIR: /var/lib/qemu-tool/stacks/nixl-rocjitsu
  NVME_MOUNT: /mnt/nixl-nvme
  # The architecture of the guest's emulated GPU. AMD's PyTorch needs its
  # device package for it: without one, torch reports the GPU and then fails
  # its first operation with hipErrorInvalidKernelFile.
  GUEST_GPU_ARCH: gfx1250
  UV_VERSION: 0.13.9

jobs:

  gate:
    name: Check for a matching guest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      supported: ${{ steps.decide.outputs.supported }}
      rocm-xy: ${{ steps.decide.outputs.rocm-xy }}
    steps:
    - name: Compare the requested ROCm version with the guest's
      id: decide
      shell: bash
      env:
        ROCM_VERSION: ${{ inputs.rocm-version }}
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        set -euo pipefail
        if [[ ! "$ROCM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::rocm-version must be X.Y.Z, got '${ROCM_VERSION}'"
          exit 1
        fi
        if [[ ! "$PYTHON_VERSION" =~ ^3\.[0-9]+$ ]]; then
          echo "::error::python-version must be 3.Y, got '${PYTHON_VERSION}'"
          exit 1
        fi
        xy=${ROCM_VERSION%.*}
        echo "rocm-xy=${xy}" >> "$GITHUB_OUTPUT"
        if [ "$xy" = "$GUEST_ROCM" ]; then
          echo "supported=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "supported=false" >> "$GITHUB_OUTPUT"
        msg="rocjitsu smoke test skipped for ROCm ${ROCM_VERSION}: the guest of the pinned qemu-tool carries ROCm ${GUEST_ROCM}, so the rocm-nixl wheel's ROCm ${xy} backend cannot be selected there."
        echo "::notice title=rocjitsu smoke test skipped::${msg}"
        echo "${msg}" >> "$GITHUB_STEP_SUMMARY"

  smoke-test:
    name: Smoke test (ROCm ${{ inputs.rocm-version }}, Python ${{ inputs.python-version }})
    needs: gate
    if: needs.gate.outputs.supported == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        # Named, so that every step runs under errexit and pipefail; the
        # runner's default bash has no pipefail.
        shell: bash
    env:
      ROCM_XY: ${{ needs.gate.outputs.rocm-xy }}
      PYTHON_VERSION: ${{ inputs.python-version }}
    steps:
    - name: Check out code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    # The device must exist; the action makes it usable by this user.
    - name: Require KVM
      run: |
        set -euo pipefail
        if [ ! -c /dev/kvm ]; then
          echo "::error::/dev/kvm is not usable on this runner; the guest cannot boot without it"
          exit 1
        fi

    - name: Download the wheels from this run
      if: ${{ !inputs.run-id }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: wheels

    - name: Download the wheels from run ${{ inputs.run-id }}
      if: ${{ inputs.run-id }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: wheels
        run-id: ${{ inputs.run-id }}
        github-token: ${{ github.token }}

    - name: Check the artifact has the wheel this job installs
      run: |
        set -euo pipefail
        shopt -s nullglob
        ls -l wheels
        tag="cp${PYTHON_VERSION/./}"
        wheel=(wheels/rocm_nixl-*-"${tag}"-"${tag}"-*.whl)
        if [ "${#wheel[@]}" -ne 1 ]; then
          echo "::error::expected exactly one rocm_nixl wheel for ${tag} in the artifact, found ${#wheel[@]}"
          exit 1
        fi
        backend="nixl_rocm${ROCM_XY/./_}"
        if ! python3 -I -c 'import sys, zipfile; sys.exit(0 if sys.argv[2] + "/__init__.py" in zipfile.ZipFile(sys.argv[1]).namelist() else 1)' \
            "${wheel[0]}" "$backend"; then
          echo "::error::${wheel[0]} does not contain the ${backend} backend"
          exit 1
        fi
        echo "MERGED_WHEEL=${wheel[0]}" >> "$GITHUB_ENV"
        test -f .ci/scripts/rocm_wheel_smoke_test.py

    # Under the two layers is the rocm-golden fleet of the pinned qemu-tool.
    # The action installs qemu-tool, prepares the host, boots the guest, waits
    # for its SSH, stages the firmware of the rocjitsu serving its GPU and
    # loads amdgpu; with gpu: required the step fails unless the GPU ended
    # bound. It exports QEMU_TOOL_SSH_CONFIG, in which the guest is 'guest'.
    # The other inputs keep the action's defaults: a fresh guest disk, no
    # metrics stack, a guest sized from the runner, and a teardown when the
    # job ends whatever happens.
    - name: Boot one guest with an emulated GPU and a spare NVMe
      id: fleet
      timeout-minutes: 25
      uses: sbates130272/qemu-tool-action@a7468c9e32d6f8f8a323d1e6861a136b8a6fa44c # v2.2.0
      with:
        qemu-tool-ref: ${{ env.QEMU_MINIMAL_REF }}
        stack-dir: ${{ env.STACK_DIR }}
        xml-overlay: |
          ${{ github.workspace }}/.ci/rocjitsu/fleet-overlay-common.xml
          ${{ github.workspace }}/.ci/rocjitsu/fleet-overlay.xml
        gpu: required
        ssh-aliases: guest
        wait-for: ssh
        wait-timeout: 900

    - name: Check the qemu-tool pin and the fleet that booted
      env:
        TOOL_SHA: ${{ steps.fleet.outputs.qemu-tool-sha }}
        VM_COUNT: ${{ steps.fleet.outputs.vm-count }}
        FLEET_XML: ${{ steps.fleet.outputs.fleet-xml }}
      run: |
        set -euo pipefail
        echo "$FLEET_XML"
        if [ "$TOOL_SHA" != "$QEMU_MINIMAL_REF" ]; then
          echo "::error::the action installed qemu-tool from the commit '${TOOL_SHA}', not from QEMU_MINIMAL_REF ${QEMU_MINIMAL_REF}"
          exit 1
        fi
        if [ "$VM_COUNT" != 1 ]; then
          echo "::error::the action booted '${VM_COUNT}' guest(s), not one"
          exit 1
        fi
        ssh -F "$QEMU_TOOL_SSH_CONFIG" guest true

    - name: Check the guest's ROCm version
      run: |
        ssh -F "$QEMU_TOOL_SSH_CONFIG" guest bash -s -- "$ROCM_XY" <<'GUEST'
        set -euo pipefail
        want=$1
        ver=""
        for f in /opt/rocm/.info/version /opt/rocm/core/.info/version \
                 /opt/rocm/core-*/.info/version; do
          if [ -s "$f" ]; then ver=$(head -1 "$f"); break; fi
        done
        echo "guest ROCm version: ${ver:-unknown}; ROCM_PATH: ${ROCM_PATH:-unset}"
        case "$ver" in
          "$want".*|"$want") ;;
          *)
            echo "::error::the guest carries ROCm '${ver:-unknown}', not ${want}; the guest image of the pinned qemu-tool, which fleet-overlay-common.xml pins by digest, and GUEST_ROCM in this workflow disagree"
            exit 1
            ;;
        esac
        GUEST

    # The action bound the GPU; what HIP needs besides is checked here. A bound
    # GPU is a named node in the KFD topology.
    - name: Check the GPU is usable in the guest
      run: |
        ssh -F "$QEMU_TOOL_SSH_CONFIG" guest bash -s <<'GUEST'
        set -euo pipefail
        gpus=$(cat /sys/class/kfd/kfd/topology/nodes/*/name 2>/dev/null | grep -c . || true)
        if [ "${gpus:-0}" -lt 1 ]; then
          echo "::error::no GPU node in the KFD topology (amdgpu-probe --status: $(/usr/local/bin/amdgpu-probe --status 2>&1))"
          sudo -n dmesg | grep -i amdgpu | tail -40 || true
          exit 1
        fi
        echo "${gpus} GPU node(s) in the KFD topology"
        if [ ! -r /dev/kfd ] || [ ! -w /dev/kfd ]; then
          echo "::error::$(id -un) cannot open /dev/kfd (groups: $(id -nG)); HIP would see no device"
          exit 1
        fi
        GUEST

    - name: Format and mount the spare NVMe
      run: |
        ssh -F "$QEMU_TOOL_SSH_CONFIG" guest bash -s -- "$NVME_MOUNT" <<'GUEST'
        set -euo pipefail
        mnt=$1
        lsblk -o NAME,TYPE,SIZE,FSTYPE,MOUNTPOINTS
        root_src=$(findmnt -no SOURCE /)
        root_disk=$(lsblk -no PKNAME "$root_src" 2>/dev/null | head -1 || true)
        dev=""
        while read -r name type; do
          [ "$type" = disk ] || continue
          [[ "$name" =~ ^/dev/nvme[0-9]+n[0-9]+$ ]] || continue
          [ "$name" != "$root_src" ] || continue
          [ "$name" != "/dev/${root_disk}" ] || continue
          # Nothing on it or on a partition of it may be mounted.
          [ -z "$(lsblk -no MOUNTPOINTS "$name" | tr -d '[:space:]')" ] || continue
          dev=$name
          break
        done < <(lsblk -dpno NAME,TYPE)
        if [ -z "$dev" ]; then
          echo "::error::the guest has no spare NVMe namespace"
          exit 1
        fi
        echo "spare NVMe: ${dev}"
        sudo -n mkfs.ext4 -q -F "$dev"
        sudo -n mkdir -p "$mnt"
        sudo -n mount -o noatime "$dev" "$mnt"
        sudo -n chmod 1777 "$mnt"
        test "$(findmnt -no SOURCE "$mnt")" = "$dev"
        df -h "$mnt"
        GUEST

    - name: Install the wheel in the guest
      run: |
        set -euo pipefail
        ssh -F "$QEMU_TOOL_SSH_CONFIG" guest 'rm -rf "$HOME/nixl-smoke" && mkdir -p "$HOME/nixl-smoke/wheels"'
        scp -F "$QEMU_TOOL_SSH_CONFIG" "$MERGED_WHEEL" guest:nixl-smoke/wheels/
        scp -F "$QEMU_TOOL_SSH_CONFIG" .ci/scripts/rocm_wheel_smoke_test.py guest:nixl-smoke/

        ssh -F "$QEMU_TOOL_SSH_CONFIG" guest bash -s -- "$PYTHON_VERSION" "$UV_VERSION" <<'GUEST'
        set -euo pipefail
        shopt -s nullglob
        py=$1
        uv_version=$2
        work="$HOME/nixl-smoke"
        venv="$work/venv"

        # uv supplies the requested interpreter when the guest's own python3
        # is another version.
        python3 -m venv "$work/uv-bootstrap"
        "$work/uv-bootstrap/bin/pip" install --quiet "uv==${uv_version}"
        uv="$work/uv-bootstrap/bin/uv"
        "$uv" venv --python "$py" "$venv"

        # numpy is the wheel's only unconditional dependency and the only
        # package taken from an index. The wheel is installed from the copied
        # file with no index, so it can pull nothing else in.
        "$uv" pip install --python "$venv/bin/python" numpy
        wheel=("$work"/wheels/rocm_nixl-*.whl)
        "$uv" pip install --python "$venv/bin/python" --no-index "${wheel[@]}"
        "$uv" pip list --python "$venv/bin/python" | tee "$work/pip-list.txt"

        if ! "$venv/bin/python" -c 'import importlib.util, sys; sys.exit(0 if importlib.util.find_spec("torch") is None else 1)'; then
          echo "::error::torch is installed in the guest environment; rocm-nixl must not bring it in"
          exit 1
        fi
        echo "torch is not installed"
        GUEST

    # --allow-ais-compat: hipFile's fast path is unproven on the emulated GPU
    # and NVMe. The test reports which path ran.
    - name: Run the smoke test
      run: |
        ssh -F "$QEMU_TOOL_SSH_CONFIG" guest bash -s -- "$ROCM_XY" "$NVME_MOUNT" <<'GUEST'
        set -euo pipefail
        cd "$HOME/nixl-smoke"
        . venv/bin/activate
        python3 rocm_wheel_smoke_test.py --expect-rocm "$1" --gpu \
          --ais-dir "$2" --allow-ais-compat --json-out smoke.json 2>&1 | tee smoke-test.log
        GUEST

    # The tests have to match the wheel, so they come from the commit it was
    # built from and not from this workflow's.
    - name: Check out the wheels' source
      if: ${{ inputs.source-ref != '' }}
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: ${{ inputs.source-ref }}
        path: nixl-source
        persist-credentials: false

    # A second environment, as a user makes it: the wheel with its
    # rocm<X>.<Y> extra, which brings AMD's PyTorch from AMD's index, and that
    # PyTorch's device package for the guest's GPU. The first environment
    # stays without torch and only gains pytest.
    - name: Install the Python tests in the guest
      if: ${{ inputs.source-ref != '' }}
      run: |
        set -euo pipefail
        ssh -F "$QEMU_TOOL_SSH_CONFIG" guest 'mkdir -p "$HOME/nixl-smoke/source"'
        tar -cC nixl-source --exclude=.git . \
          | ssh -F "$QEMU_TOOL_SSH_CONFIG" guest 'tar -xC "$HOME/nixl-smoke/source"'
        scp -F "$QEMU_TOOL_SSH_CONFIG" \
          .ci/scripts/rocm_wheel_python_test.py .ci/scripts/rocm_wheel_unit_test.py \
          guest:nixl-smoke/

        ssh -F "$QEMU_TOOL_SSH_CONFIG" guest bash -s -- "$PYTHON_VERSION" "$ROCM_XY" "$GUEST_GPU_ARCH" <<'GUEST'
        set -euo pipefail
        shopt -s nullglob
        py=$1
        rocm_xy=$2
        arch=$3
        work="$HOME/nixl-smoke"
        uv="$work/uv-bootstrap/bin/uv"

        "$uv" pip install --python "$work/venv/bin/python" pytest pytest-timeout

        # The PyTorch the extra pins and the index it is on, from the table
        # the wheel's extras were generated from.
        read -r torch index < <(cd "$work/source/contrib" && "$work/venv/bin/python" -c '
        import sys
        from wheel_merge_rocm import ROCM_PYTORCH
        entry = ROCM_PYTORCH[sys.argv[1]]
        print(entry.torch, entry.index_url)' "$rocm_xy")
        echo "rocm${rocm_xy} extra: torch==${torch} from ${index}"

        wheel=("$work"/wheels/rocm_nixl-*.whl)
        "$uv" venv --python "$py" "$work/venv-torch"
        "$uv" pip install --python "$work/venv-torch/bin/python" \
          --extra-index-url "$index" --index-strategy unsafe-best-match \
          "${wheel[0]}[rocm${rocm_xy}]" "torch[device-${arch}]==${torch}" \
          pytest pytest-timeout
        "$uv" pip list --python "$work/venv-torch/bin/python" | tee "$work/pip-list-torch.txt"
        GUEST

    - name: Run the Python tests
      if: ${{ inputs.source-ref != '' }}
      run: |
        ssh -F "$QEMU_TOOL_SSH_CONFIG" guest bash -s <<'GUEST'
        set -euo pipefail
        cd "$HOME/nixl-smoke"
        venv-torch/bin/python rocm_wheel_python_test.py \
          --source-dir source \
          --python venv/bin/python \
          --torch-python venv-torch/bin/python \
          --json-out python.json 2>&1 | tee python-test.log
        GUEST

    - name: Collect the test results
      if: always()
      run: |
        mkdir -p "$GITHUB_WORKSPACE/rocjitsu-results"
        if [ -n "${QEMU_TOOL_SSH_CONFIG:-}" ]; then
          for f in smoke.json python.json; do
            scp -F "$QEMU_TOOL_SSH_CONFIG" "guest:nixl-smoke/$f" "$GITHUB_WORKSPACE/rocjitsu-results/" || true
          done
        fi

    - name: Upload the test results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: rocm-check-results-rocjitsu-${{ inputs.rocm-version }}${{ inputs.artifact-suffix }}
        path: rocjitsu-results/*.json
        if-no-files-found: ignore

    - name: Collect diagnostics
      if: always()
      run: |
        out="$GITHUB_WORKSPACE/rocjitsu-diagnostics"
        mkdir -p "$out"
        if [ -n "${QEMU_TOOL_SSH_CONFIG:-}" ]; then
          g() { ssh -F "$QEMU_TOOL_SSH_CONFIG" guest "$@"; }
          g 'sudo -n dmesg' > "$out/dmesg.txt" 2>&1 || true
          g bash -s > "$out/amdgpu-probe-state.txt" 2>&1 <<'GUEST' || true
        echo "amdgpu-probe --status: $(/usr/local/bin/amdgpu-probe --status 2>&1)"
        echo "--- KFD topology node names"
        cat /sys/class/kfd/kfd/topology/nodes/*/name 2>&1
        echo "--- AMD PCI functions and their drivers"
        for dev in /sys/bus/pci/devices/*; do
          [ "$(cat "$dev/vendor" 2>/dev/null)" = 0x1002 ] || continue
          drv=none
          [ -e "$dev/driver" ] && drv=$(basename "$(readlink -f "$dev/driver")")
          echo "$(basename "$dev") device=$(cat "$dev/device") class=$(cat "$dev/class") driver=${drv}"
        done
        echo "--- device nodes"
        ls -l /dev/kfd /dev/dri 2>&1
        echo "--- amdgpu module parameters"
        grep -H . /sys/module/amdgpu/parameters/{emu_mode,fw_load_type,discovery,ip_block_mask,vm_update_mode,gpu_recovery,vramlimit} 2>&1
        echo "--- block devices"
        lsblk -o NAME,TYPE,SIZE,FSTYPE,MOUNTPOINTS 2>&1
        echo "--- ROCm"
        cat /opt/rocm/core-*/.info/version /etc/rocjitsu-guest.json 2>&1
        GUEST
          for f in smoke-test.log pip-list.txt python-test.log pip-list-torch.txt; do
            scp -F "$QEMU_TOOL_SSH_CONFIG" "guest:nixl-smoke/$f" "$out/" || true
          done
        fi
        if [ -f "$STACK_DIR/docker-compose.yml" ]; then
          qemu-tool compose --stack-dir "$STACK_DIR" logs --no-color --tail 500 \
            > "$out/compose-logs.txt" 2>&1 || true
        fi
        ls -l "$out"

    - name: Upload diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: rocjitsu-smoke-${{ inputs.rocm-version }}-py${{ inputs.python-version }}${{ inputs.artifact-suffix }}
        path: rocjitsu-diagnostics/
        if-no-files-found: warn
