[defaults]
inventory = ./inventory.py
host_key_checking = False
# The guests are four QEMU processes on one host; serialising them turns a
# 14-second GPU probe into a minute.
forks = 8
result_format = yaml
display_skipped_hosts = False
interpreter_python = /usr/bin/python3

[ssh_connection]
# The guests are reached through forwarded localhost ports, so a control
# master is worth a lot here: every task would otherwise pay a fresh TCP
# handshake through QEMU's user-mode NAT.
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s
