schema = 1
env_class = "gha-kvm-vm2"
# A template: the lane job renders it to JSON with 'amd_bench_ci.py env', which
# sets every "@job" value and takes out of 'provides' what the job could not
# set up. A case whose need is taken out ends as skip/env.
provides = ["gpu", "rdma", "two_hosts"]

# The initiator binds the address the target connects to, so it is the guest
# whose 'ip' the cases use.
[roles]
init = "guest1"
tgt = "guest2"

[hosts.guest1]
kind = "ssh"
ssh_config = "@job"
ssh_host = "guest1"
# Both are relative to the guest's home directory.
work_dir = "amd-bench/run"
nixlbench = "amd-bench/venv/bin/nixlbench"

[hosts.guest1.vars]
ip = "192.168.100.11"
# The netdev of the emulated NIC, then the RDMA device and its port:
# "<netdev>,ernic0:1", or the netdev alone when "rdma" is taken out.
ucx_net_devices = "@job"

[hosts.guest2]
kind = "ssh"
ssh_config = "@job"
ssh_host = "guest2"
# Both are relative to the guest's home directory.
work_dir = "amd-bench/run"
nixlbench = "amd-bench/venv/bin/nixlbench"

[hosts.guest2.vars]
ip = "192.168.100.12"
ucx_net_devices = "@job"

[vars]
asio_port_base = 21000

# After each case that used the GPU: a compute device node that is gone or
# empty makes the rest of the GPU cases skip/device-suspect. Each probe runs
# in both guests, because a device that is gone in the target's guest fails
# the same cases.
[[probe]]
name = "gpu-kfd"
when = "between"
classes = ["gpu"]
cmd = "test -r /dev/kfd -a -w /dev/kfd && grep -q . /sys/class/kfd/kfd/topology/nodes/*/name"

[[probe]]
name = "gpu-kfd-tgt"
host = "tgt"
when = "between"
classes = ["gpu"]
cmd = "test -r /dev/kfd -a -w /dev/kfd && grep -q . /sys/class/kfd/kfd/topology/nodes/*/name"

# ernic0 is the name the job gives the RDMA device. It takes "rdma" out of
# 'provides' when the device could not be named so or its port is not active.
[[probe]]
name = "rdma-port"
when = "between"
classes = ["rdma"]
cmd = "grep -q ACTIVE /sys/class/infiniband/ernic0/ports/1/state"

[[probe]]
name = "rdma-port-tgt"
host = "tgt"
when = "between"
classes = ["rdma"]
cmd = "grep -q ACTIVE /sys/class/infiniband/ernic0/ports/1/state"
