schema = 1
lane = "vm2-net"
lane_id = "T-NET"
env_class = "gha-kvm-vm2"
timing_trust = "emulated"
topology = "two-host"
status = "active"
aa_case = "vm2-net/ucx/tcp/DD/WRITE/N"
description = "Two rocjitsu guests joined by the rocm-ernic mesh: UCX over tcp, rc and ud between host and GPU memory"

[defaults]
tier = "nightly"
timeout_s = 180
attach = "net-tcp"

# Only tcp between host memory has passed often enough to gate on; rc, ud
# and GPU memory are reported.
[[case]]
key = "vm2-net/ucx/{transport}/{mem}/{op}/S"
workload = "ucx/{transport}/{mem}/{op}/S"
profile = "S"
backend = "UCX"
[case.axes]
transport = ["tcp", "rc", "ud"]
mem = ["DD", "VV", "DV", "VD"]
op = ["WRITE", "READ"]
[[case.when]]
match = { transport = ["rc", "ud"] }
set = { attach = "net-rdma" }
[[case.when]]
match = { transport = "tcp", mem = "DD" }
set = { role = "gate" }

[[case]]
key = "vm2-net/ucx/tcp/{mem}/WRITE/N"
workload = "ucx/tcp/{mem}/WRITE/N"
profile = "N"
backend = "UCX"
transport = "tcp"
op = "WRITE"
role = "track"
timeout_s = 360
[case.axes]
mem = ["DD", "VV"]
[[case.when]]
match = { mem = "DD" }
set = { sentinel = true }

[[case]]
key = "vm2-net/ucx/rc/{mem}/WRITE/N-r"
workload = "ucx/rc/{mem}/WRITE/N-r"
profile = "N-r"
backend = "UCX"
transport = "rc"
op = "WRITE"
attach = "net-rdma"
role = "track"
timeout_s = 360
[case.axes]
mem = ["DD", "VV"]
[[case.when]]
match = { mem = "DD" }
set = { sentinel = true }

[[case]]
key = "vm2-net/ucx/rc/DD/WRITE/B"
workload = "ucx/rc/DD/WRITE/B"
profile = "B"
backend = "UCX"
transport = "rc"
op = "WRITE"
attach = "net-rdma"
role = "track"
timeout_s = 360

[[case]]
key = "vm2-net/libfabric/tcp/DD/{op}/S"
workload = "libfabric/tcp/DD/{op}/S"
profile = "S"
backend = "LIBFABRIC"
transport = "tcp"
status = "blocked"
blocked_by = ["E8"]
needs = ["libfabric"]
flags = { enable_pt = true, progress_threads = 1 }
env = { FI_UNIVERSE_SIZE = "16" }
[case.axes]
op = ["WRITE", "READ"]

# Experiments, see "Experiments you can dispatch" in .ci/docs/amd-bench.md.
# The cases under x-vram are in the weekly tier, which no schedule runs. Each
# is a nightly case with one thing changed: take "x-vram/<change>/" out of
# its key for the case it is compared with.
#
# rc with GPU memory failed the data check at S and passed at N-r. buf64 is S
# with the 64 MiB buffer N-r has on VRAM, and buf32 is N-r with the 32 MiB
# one of S, so that the buffer's size is told from the rest of a profile.
[[case]]
key = "vm2-net/x-vram/buf64/ucx/rc/{mem}/{op}/S"
workload = "x-vram/buf64/ucx/rc/{mem}/{op}/S"
profile = "S"
backend = "UCX"
transport = "rc"
attach = "net-rdma"
tier = "weekly"
flags = { total_buffer_size = 67108864 }
[case.axes]
mem = ["VV", "DV", "VD"]
op = ["WRITE", "READ"]

[[case]]
key = "vm2-net/x-vram/buf32/ucx/rc/VV/WRITE/N-r"
workload = "x-vram/buf32/ucx/rc/VV/WRITE/N-r"
profile = "N-r"
backend = "UCX"
transport = "rc"
op = "WRITE"
init_mem = "VRAM"
tgt_mem = "VRAM"
attach = "net-rdma"
tier = "weekly"
timeout_s = 360
flags = { total_buffer_size = 33554432 }

# S transfers for about 63 ms here, 80 iterations of 0.8 ms (one is a batch
# of 4 blocks), in a process that lives 6 s. This warm-up lasts about 13 s,
# so a result that depends on how old the buffer is changes.
[[case]]
key = "vm2-net/x-vram/warm/ucx/rc/{mem}/{op}/S"
workload = "x-vram/warm/ucx/rc/{mem}/{op}/S"
profile = "S"
backend = "UCX"
transport = "rc"
attach = "net-rdma"
tier = "weekly"
timeout_s = 360
flags = { warmup_iter = 16384 }
[case.axes]
mem = ["VV", "DV", "VD"]
op = ["WRITE", "READ"]

# For the log alone: at this level UCX says whether the RDMA device and ROCm
# can share GPU memory as a dmabuf, and when an export of one fails.
[[case]]
key = "vm2-net/x-vram/ucxdebug/ucx/rc/VV/WRITE/S"
workload = "x-vram/ucxdebug/ucx/rc/VV/WRITE/S"
profile = "S"
backend = "UCX"
transport = "rc"
op = "WRITE"
init_mem = "VRAM"
tgt_mem = "VRAM"
attach = "net-rdma"
tier = "weekly"
env = { UCX_LOG_LEVEL = "debug" }

[[pair]]
key = "vm2-net/vram-dram/tcp/WRITE/N"
kind = "vram-dram"
num = "vm2-net/ucx/tcp/VV/WRITE/N"
den = "vm2-net/ucx/tcp/DD/WRITE/N"

[[pair]]
key = "vm2-net/vram-dram/rc/WRITE/N-r"
kind = "vram-dram"
num = "vm2-net/ucx/rc/VV/WRITE/N-r"
den = "vm2-net/ucx/rc/DD/WRITE/N-r"

# N-r is N without its last row, so these ratios exist for blocks up to 2 MiB.
[[pair]]
key = "vm2-net/rc-tcp/DD/WRITE/N"
kind = "rc-tcp"
num = "vm2-net/ucx/rc/DD/WRITE/N-r"
den = "vm2-net/ucx/tcp/DD/WRITE/N"

[[pair]]
key = "vm2-net/rc-tcp/VV/WRITE/N"
kind = "rc-tcp"
num = "vm2-net/ucx/rc/VV/WRITE/N-r"
den = "vm2-net/ucx/tcp/VV/WRITE/N"
