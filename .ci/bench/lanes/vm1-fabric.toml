schema = 1
lane = "vm1-fabric"
lane_id = "F-LBA"
env_class = "gha-kvm-vm1-nvmeof"
timing_trust = "emulated"
topology = "single"
status = "active"
aa_case = "vm1-fabric/posix/AIO/buffered/WRITE/N"
description = "One rocjitsu guest and the rocm-ernic NVMe-over-Fabrics target: storage and Key Value over nvme-rdma"

# The job selects the rocm-ernic nvmeof backend with a compose override and
# connects to it with nvme-rdma. The target has three namespaces: nsid 1
# (1 GiB, 4096-byte blocks) holds the ext4 file system of the POSIX and AIS
# cases, nsid 2 (64 MiB, 512-byte blocks) is the raw device of the GUSLI
# cases, and nsid 3 is the Key Value one. The Key Value cases wait for their
# plugin; until then the environment only checks, once, that the namespace
# has its generic node.

[defaults]
tier = "nightly"
timeout_s = 180
attach = "fabric-rdma"

# LBA-STD: the storage cases of vm1-local.toml, which explains them, with the
# same workload keys.
[[case]]
key = "vm1-fabric/posix/{api}/{io}/{op}/S"
workload = "posix/{api}/{io}/{op}/S"
profile = "S"
backend = "POSIX"
engine = "{api}"
tgt_mem = "FILE"
role = "gate"
flags = { posix_api_type = "{api}", filepath = "{posix_dir}/{op}" }
[case.axes]
api = ["AIO", "URING", "POSIXAIO"]
io = ["buffered", "direct"]
op = ["WRITE", "READ"]
[[case.when]]
match = { io = "direct" }
set = { direct = true }
[[case.when]]
match = { api = "URING" }
set = { needs = ["io_uring"] }

[[case]]
key = "vm1-fabric/posix/URING/direct/{op}/N"
workload = "posix/URING/direct/{op}/N"
profile = "N"
backend = "POSIX"
engine = "URING"
tgt_mem = "FILE"
direct = true
role = "track"
timeout_s = 360
needs = ["io_uring"]
flags = { posix_api_type = "URING", filepath = "{posix_dir}/{op}" }
[case.axes]
op = ["WRITE", "READ"]

[[case]]
key = "vm1-fabric/posix/AIO/buffered/WRITE/N"
workload = "posix/AIO/buffered/WRITE/N"
profile = "N"
backend = "POSIX"
engine = "AIO"
tgt_mem = "FILE"
op = "WRITE"
role = "track"
timeout_s = 360
sentinel = true
flags = { posix_api_type = "AIO", filepath = "{posix_dir}/WRITE" }

[[case]]
key = "vm1-fabric/posix/URING/direct-blockaligned/{op}/S"
workload = "posix/URING/direct-blockaligned/{op}/S"
profile = "S"
backend = "POSIX"
engine = "URING"
tgt_mem = "FILE"
direct = true
role = "gate"
needs = ["io_uring"]
[case.flags]
posix_api_type = "URING"
filepath = "{posix_dir}/{op}"
randomize_location_mode = "blockaligned"
randomize_location_mode_seed = 1
[case.axes]
op = ["WRITE", "READ"]

[[case]]
key = "vm1-fabric/posix/AIO/buffered/QUERY/S"
workload = "posix/AIO/buffered/QUERY/S"
profile = "S"
backend = "POSIX"
engine = "AIO"
tgt_mem = "FILE"
op = "QUERY"
flags = { posix_api_type = "AIO", filepath = "{posix_dir}/QUERY" }

[[case]]
key = "vm1-fabric/ais/{path}/{op}/S"
workload = "ais/{path}/{op}/S"
profile = "S"
backend = "AIS"
engine = "{path}"
init_mem = "VRAM"
tgt_mem = "FILE"
flags = { gds_mt_num_threads = 4, filepath = "{ais_dir}/{op}" }
[case.axes]
path = ["compat-allowed", "fast-required"]
op = ["WRITE", "READ"]
[[case.when]]
match = { path = "compat-allowed" }
[case.when.set]
role = "gate"
env = { HIPFILE_ALLOW_COMPAT_MODE = "true", HIPFILE_UNSUPPORTED_FILE_SYSTEMS = "true" }
[[case.when]]
match = { path = "fast-required" }
[case.when.set]
direct = true
env = { HIPFILE_ALLOW_COMPAT_MODE = "false", HIPFILE_FORCE_COMPAT_MODE = "false" }

[[case]]
key = "vm1-fabric/ais/compat-allowed/WRITE/N"
workload = "ais/compat-allowed/WRITE/N"
profile = "N"
backend = "AIS"
engine = "compat-allowed"
init_mem = "VRAM"
tgt_mem = "FILE"
op = "WRITE"
role = "track"
timeout_s = 360
flags = { gds_mt_num_threads = 4, filepath = "{ais_dir}/WRITE" }
env = { HIPFILE_ALLOW_COMPAT_MODE = "true", HIPFILE_UNSUPPORTED_FILE_SYSTEMS = "true" }

[[case]]
key = "vm1-fabric/gusli/K/{op}/S"
workload = "gusli/K/{op}/S"
profile = "S"
backend = "GUSLI"
engine = "K"
tgt_mem = "BLK"
direct = true
role = "gate"
needs = ["blkdev"]
flags = { device_list = "11:K:{gusli_blkdev}", start_batch_size = 1, max_batch_size = 1 }
[case.axes]
op = ["READ", "WRITE"]

# The direct and buffered pairs of vm1-local.toml, on this attachment.
[[pair]]
key = "vm1-fabric/direct-buffered/AIO/WRITE/S"
kind = "direct-buffered"
num = "vm1-fabric/posix/AIO/direct/WRITE/S"
den = "vm1-fabric/posix/AIO/buffered/WRITE/S"

[[pair]]
key = "vm1-fabric/direct-buffered/AIO/READ/S"
kind = "direct-buffered"
num = "vm1-fabric/posix/AIO/direct/READ/S"
den = "vm1-fabric/posix/AIO/buffered/READ/S"

[[pair]]
key = "vm1-fabric/direct-buffered/URING/WRITE/S"
kind = "direct-buffered"
num = "vm1-fabric/posix/URING/direct/WRITE/S"
den = "vm1-fabric/posix/URING/buffered/WRITE/S"

[[pair]]
key = "vm1-fabric/direct-buffered/URING/READ/S"
kind = "direct-buffered"
num = "vm1-fabric/posix/URING/direct/READ/S"
den = "vm1-fabric/posix/URING/buffered/READ/S"

[[pair]]
key = "vm1-fabric/direct-buffered/POSIXAIO/WRITE/S"
kind = "direct-buffered"
num = "vm1-fabric/posix/POSIXAIO/direct/WRITE/S"
den = "vm1-fabric/posix/POSIXAIO/buffered/WRITE/S"

[[pair]]
key = "vm1-fabric/direct-buffered/POSIXAIO/READ/S"
kind = "direct-buffered"
num = "vm1-fabric/posix/POSIXAIO/direct/READ/S"
den = "vm1-fabric/posix/POSIXAIO/buffered/READ/S"

# KV-STD. The NVME_KV backend, the flag that names its device and the data
# check these profiles ask for all come with the plugin, so the flags here
# are not yet the whole command line.
[[case]]
key = "vm1-fabric/kv/{init_mem}/WRITE/KV-W"
workload = "kv/{init_mem}/WRITE/KV-W"
profile = "KV-W"
backend = "NVME_KV"
tgt_mem = "KV"
op = "WRITE"
status = "blocked"
blocked_by = ["W13", "W11"]
[case.axes]
init_mem = ["DRAM", "VRAM"]

[[case]]
key = "vm1-fabric/kv/{init_mem}/READ/KV-R-{size}"
workload = "kv/{init_mem}/READ/KV-R-{size}"
profile = "KV-R-{size}"
backend = "NVME_KV"
tgt_mem = "KV"
op = "READ"
status = "blocked"
blocked_by = ["W13", "W11"]
[case.axes]
init_mem = ["DRAM", "VRAM"]
size = [4096, 16384, 65536, 131072]

[[case]]
key = "vm1-fabric/kv/DRAM/QUERY/KV-R-4096"
workload = "kv/DRAM/QUERY/KV-R-4096"
profile = "KV-R-4096"
backend = "NVME_KV"
tgt_mem = "KV"
op = "QUERY"
status = "blocked"
blocked_by = ["W13", "W11"]

# Experiments, see "Experiments you can dispatch" in .ci/docs/amd-bench.md.
# The cases under x-vram are in the weekly tier, which no schedule runs. Each
# is a nightly case with one thing changed: take "x-vram/<change>/" out of
# its key for the case it is compared with. They use the directories of the
# cases they are compared with, so they need no more of the file system.
#
# AIS failed the data check at S and passed at N. buf64 is S with the 64 MiB
# buffer N has on VRAM, and buf32 is N with the 32 MiB one of S, so that the
# buffer's size is told from the rest of a profile.
[[case]]
key = "vm1-fabric/x-vram/buf64/ais/{path}/{op}/S"
workload = "x-vram/buf64/ais/{path}/{op}/S"
profile = "S"
backend = "AIS"
engine = "{path}"
init_mem = "VRAM"
tgt_mem = "FILE"
tier = "weekly"
flags = { gds_mt_num_threads = 4, filepath = "{ais_dir}/{op}", total_buffer_size = 67108864 }
[case.axes]
path = ["compat-allowed", "fast-required"]
op = ["WRITE", "READ"]
[[case.when]]
match = { path = "compat-allowed" }
[case.when.set]
env = { HIPFILE_ALLOW_COMPAT_MODE = "true", HIPFILE_UNSUPPORTED_FILE_SYSTEMS = "true" }
[[case.when]]
match = { path = "fast-required" }
[case.when.set]
direct = true
env = { HIPFILE_ALLOW_COMPAT_MODE = "false", HIPFILE_FORCE_COMPAT_MODE = "false" }

[[case]]
key = "vm1-fabric/x-vram/buf32/ais/compat-allowed/WRITE/N"
workload = "x-vram/buf32/ais/compat-allowed/WRITE/N"
profile = "N"
backend = "AIS"
engine = "compat-allowed"
init_mem = "VRAM"
tgt_mem = "FILE"
op = "WRITE"
tier = "weekly"
timeout_s = 360
flags = { gds_mt_num_threads = 4, filepath = "{ais_dir}/WRITE", total_buffer_size = 33554432 }
env = { HIPFILE_ALLOW_COMPAT_MODE = "true", HIPFILE_UNSUPPORTED_FILE_SYSTEMS = "true" }

# S failed before its first row, in a process that lives 2 s. At the 1.6 ms
# an iteration of N at the same block size (one is a batch of 4 blocks) the
# 80 iterations of S take about 125 ms and this warm-up lasts about 13 s, so
# a result that depends on how old the buffer is changes.
[[case]]
key = "vm1-fabric/x-vram/warm/ais/{path}/{op}/S"
workload = "x-vram/warm/ais/{path}/{op}/S"
profile = "S"
backend = "AIS"
engine = "{path}"
init_mem = "VRAM"
tgt_mem = "FILE"
tier = "weekly"
timeout_s = 360
flags = { gds_mt_num_threads = 4, filepath = "{ais_dir}/{op}", warmup_iter = 8192 }
[case.axes]
path = ["compat-allowed", "fast-required"]
op = ["WRITE", "READ"]
[[case.when]]
match = { path = "compat-allowed" }
[case.when.set]
env = { HIPFILE_ALLOW_COMPAT_MODE = "true", HIPFILE_UNSUPPORTED_FILE_SYSTEMS = "true" }
[[case.when]]
match = { path = "fast-required" }
[case.when.set]
direct = true
env = { HIPFILE_ALLOW_COMPAT_MODE = "false", HIPFILE_FORCE_COMPAT_MODE = "false" }
