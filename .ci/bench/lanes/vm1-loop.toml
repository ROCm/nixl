schema = 1
lane = "vm1-loop"
lane_id = "F-LOOP"
env_class = "gha-kvm-vm1-loopback"
timing_trust = "emulated"
topology = "single"
status = "blocked"
blocked_by = ["W4"]
aa_case = ""
description = "One rocjitsu guest and the rocm-ernic loopback backend: UCX over rc and ud between two processes in the guest"

# Waits for its job, which selects the rocm-ernic loopback backend with a
# compose override and gives the RDMA netdev its address.

[defaults]
tier = "nightly"
timeout_s = 180
attach = "net-rdma"

[[case]]
key = "vm1-loop/ucx/{transport}/{mem}/{op}/S"
workload = "ucx/{transport}/{mem}/{op}/S"
profile = "S"
backend = "UCX"
[case.axes]
transport = ["rc", "ud"]
mem = ["DD", "VV", "DV", "VD"]
op = ["WRITE", "READ"]

[[case]]
key = "vm1-loop/ucx/rc/{mem}/WRITE/N-r"
workload = "ucx/rc/{mem}/WRITE/N-r"
profile = "N-r"
backend = "UCX"
transport = "rc"
op = "WRITE"
role = "track"
timeout_s = 360
[case.axes]
mem = ["DD", "VV"]

[[pair]]
key = "vm1-loop/vram-dram/rc/WRITE/N-r"
kind = "vram-dram"
num = "vm1-loop/ucx/rc/VV/WRITE/N-r"
den = "vm1-loop/ucx/rc/DD/WRITE/N-r"
