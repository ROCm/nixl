check_consistency = true
warmup_iter = 16
num_iter = 128
large_blk_iter_ftr = 4
# nixlbench seeds one value of the registered size, so the buffer, the block
# and the value must all be the same size.
total_buffer_size = 4096
start_block_size = 4096
max_block_size = 4096
start_batch_size = 1
max_batch_size = 1

[amd]
name = "KV-R-4096"
rows = 1
description = "Key Value retrieve: one value of 4096 bytes"
