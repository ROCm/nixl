check_consistency = true
warmup_iter = 16
num_iter = 128
large_blk_iter_ftr = 4
total_buffer_size = 268435456
start_block_size = 4096
# One RDMA work request on the rocm-ernic mesh must stay under 16 MiB; this
# is N stopped well short of that.
max_block_size = 2097152
start_batch_size = 4
max_batch_size = 4

[amd]
name = "N-r"
rows = 10
description = "Nightly sweep over RDMA: N with blocks of at most 2 MiB"

[amd.when_vram]
total_buffer_size = 67108864
